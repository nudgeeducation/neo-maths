table.adult{width:100%;border-collapse:collapse;font-size:.88em;background:#fff}

<script>
/* ---------- Answer reading: equivalent forms always accepted ---------- */
function NEO_wordNum(str){
  var s=String(str).toLowerCase().replace(/[-–—]/g,' ').replace(/\band\b/g,' ').replace(/\s+/g,' ').trim();
  if(!s) return NaN;
  s=s.replace(/\bone half\b|\ba half\b/g,'half').replace(/\bthree quarters?\b/g,'threeq').replace(/\bone quarter\b|\ba quarter\b/g,'quarter').replace(/\btwo thirds?\b/g,'twothird').replace(/\bone third\b|\ba third\b/g,'third');
  var frac={half:0.5,quarter:0.25,threeq:0.75,third:1/3,twothird:2/3};
  if(frac[s]!=null) return frac[s];
  var ones={zero:0,nought:0,nil:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19};
  var tens={twenty:20,thirty:30,forty:40,fifty:50,sixty:60,seventy:70,eighty:80,ninety:90};
  var parts=s.split(' '),total=0,cur=0,used=false,fracAdd=0,i,w;
  for(i=0;i<parts.length;i++){ w=parts[i];
    if(w==='a'||w==='') continue;
    if(ones[w]!=null){cur+=ones[w];used=true;}
    else if(tens[w]!=null){cur+=tens[w];used=true;}
    else if(w==='hundred'){cur=(cur||1)*100;used=true;}
    else if(w==='thousand'){total+=(cur||1)*1000;cur=0;used=true;}
    else if(frac[w]!=null){fracAdd+=frac[w];used=true;}
    else if(w==='point'){ total+=cur;cur=0;var dec='0.',j,any=false;
      for(j=i+1;j<parts.length;j++){if(ones[parts[j]]!=null&&ones[parts[j]]<10){dec+=ones[parts[j]];any=true;}else return NaN;}
      if(!any) return NaN; return used?total+parseFloat(dec):NaN; }
    else return NaN;
  }
  return used?total+cur+fracAdd:NaN;
}
// num() plus "minus three" / "negative three".
function num(v){
  var s=String(v).toLowerCase().trim(); if(!s) return NaN;
  var mm=s.match(/^(minus|negative)\s+(.+)$/); if(mm){ var w=num(mm[2]); return isNaN(w)?NaN:-w; }
  var wn=NEO_wordNum(s); if(!isNaN(wn)) return wn;
  s=s.replace(/÷/g,'/').replace(/=/g,'');
  s=s.replace(/½/g,'0.5').replace(/¼/g,'0.25').replace(/¾/g,'0.75').replace(/[−–]/g,'-');
  s=s.replace(/(\d)\s*(cm|mm|km|m)\b/g,'$1').replace(/[, ]+/g,'');
  s=s.replace(/^\+/,'');
  var fm=s.match(/^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/);
  if(fm){var d=parseFloat(fm[2]);return d===0?NaN:parseFloat(fm[1])/d;}
  var m=s.match(/^-?\d*\.?\d+$/); return m?parseFloat(s):NaN;
}
function near(a,b,t){return Math.abs(a-b)<(t||1e-9)}
function alg(v){return String(v).toLowerCase().replace(/\s+/g,'').replace(/[×*·]/g,'').replace(/−/g,'-');}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function $(id){return document.getElementById(id);}

/* ---------- The unit: one room per lesson ---------- */
// Algebraic answers are checked by value at several test numbers, never by matching text (QA gate 6a).
function evalAt(expr,letter,v){
  var s=String(expr).toLowerCase().replace(/\s+/g,'').replace(/[×·]/g,'*').replace(/÷/g,'/').replace(/[−–]/g,'-');
  if(!s||!new RegExp('^[0-9.+\\-*/()^'+letter+']+$').test(s)) return NaN;
  s=s.replace(/(\d|\))(?=[a-z(])/g,'$1*').replace(new RegExp('('+letter+')(?=[\\d(])','g'),'$1*').replace(/\^/g,'**');
  s=s.replace(new RegExp(letter,'g'),'('+v+')');
  try{ var r=Function('"use strict";return ('+s+');')(); return typeof r==='number'&&isFinite(r)?r:NaN; }catch(e){ return NaN; }
}
function sameExpr(a,b,letter){ var t=[2,3,7,10.5,-4], ok=true; t.forEach(function(v){ var x=evalAt(a,letter,v), y=evalAt(b,letter,v); if(isNaN(x)||Math.abs(x-y)>1e-9) ok=false; }); return ok; }
var BLUEPRINT='<svg viewBox="0 0 320 400" width="320" height="400"><path d="M70 380 L120 230 M250 380 L200 230 M160 390 L160 240" stroke="#5a3f26" stroke-width="10"/><rect x="30" y="20" width="260" height="220" rx="6" fill="#2b5d8a" stroke="#5a3f26" stroke-width="10"/><g stroke="rgba(255,255,255,.35)" stroke-width="1.5"><path d="M60 20V240M90 20V240M120 20V240M150 20V240M180 20V240M210 20V240M240 20V240M270 20V240M30 50H290M30 80H290M30 110H290M30 140H290M30 170H290M30 200H290"/></g><g fill="none" stroke="#fff" stroke-width="3"><circle cx="120" cy="125" r="42"/><circle cx="120" cy="125" r="12"/><circle cx="210" cy="95" r="26"/><path d="M60 215 H260 M60 208 V222 M260 208 V222"/></g><text x="160" y="235" text-anchor="middle" font-family="Georgia" font-size="14" fill="#fff">2 + 3 × 4</text></svg>';

var LOOM=(function(){var h='<svg viewBox="0 0 520 300" width="520" height="300"><rect x="10" y="10" width="500" height="280" rx="10" fill="#6b4a2c"/><rect x="26" y="26" width="468" height="248" fill="#f3e6c4"/>';
  var x0=[50,150,290], s=36;
  for(var p=0;p<3;p++){ for(var k=0;k<=p+1;k++) h+='<rect x="'+(x0[p]+k*s-3)+'" y="110" width="6" height="'+s+'" rx="2" fill="#b0412f"/>'; for(var k2=0;k2<=p;k2++) h+='<rect x="'+(x0[p]+k2*s)+'" y="107" width="'+s+'" height="6" rx="2" fill="#b0412f"/><rect x="'+(x0[p]+k2*s)+'" y="'+(107+s)+'" width="'+s+'" height="6" rx="2" fill="#b0412f"/>';
    h+='<text x="'+(x0[p]+(p+1)*s/2)+'" y="190" text-anchor="middle" font-family="Georgia" font-size="22" fill="#3a2a10">'+(3*p+4)+'</text>'; }

 {name:'order card', title:'Order card', icon:IC.card, body:function(){return '<p>Work in this order: <b>brackets</b>, then <b>powers</b>, then <b>× and ÷</b>, then <b>+ and −</b>.</p><p>2 + 3 × 4 = 2 + 12 = 14. &nbsp; (2 + 3) × 4 = 5 × 4 = 20.</p><p>When the same kind of operation appears twice, work from left to right.</p>';}},

 {name:'pattern card', title:'Pattern card', icon:IC.pattern, body:function(){return '<p>For a sequence that goes up by the same amount each time, the <b><i>n</i>th term</b> starts with <b>(the difference) × <i>n</i></b>.</p><p>4, 7, 10, 13, … goes up by 3, so compare with 3<i>n</i>: 3, 6, 9, 12, … Each term is 1 more, so the <i>n</i>th term is 3<i>n</i> + 1.</p><p>Check: when <i>n</i> = 2, 3 × 2 + 1 = 7. ✓</p>';}},

 'The coldest temperature ever recorded on Earth is about −89 °C, at Vostok Station in Antarctica in 1983. Scientists use negative numbers every day.',

function roomHud(){
  if(at===DOME){ hud('You\'ve reached the Showroom. A huge blueprint covers the far wall: the plan for your invention, which the unit will help you build.',[['See your workshop plan',showPlan,'go']]); return; }
  var r=ROOMS[at], s=st[at], done=isOpen(at), side=s.side;
  var text=r.arrive, resolved=done||side, k=KIT[at];
  if(done) text='The door is open, and the lamp above it is lit.'; else if(side) text='The shutter rolls up. A lantern lights the back stairs, and this lock is on your packing list.';
  if(resolved && !s.kit) text+=' On the workbench, the '+k.name+' is waiting for you.';
  if(resolved && s.kit) text+=' The '+k.name+' is in your field kit.';
  var b=[['Examine the lock',openLock,'go',done],['Take the back stairs',takeSide,'soft',done||side]];
  if(resolved && !s.kit) b.push(['Pick up the '+k.name,pickUp,'go']);
  b.push([at===DOME-1?'Step into the Showroom →':'Walk on →',walkOn,'go',!resolved]);
  b.push(['Did you know?',readNote,'soft']);
  hud(text,b);
  var el=$('item'+at); if(el) el.classList.toggle('ready',resolved && !s.kit);
}

/* ---------- Field kit and notes ---------- */
function kitCount(){ var n=st.filter(function(s){return s.kit;}).length; $('kitCount').textContent=n; return n; }
function toolCard(i){ var k=KIT[i]; return '<div class="tool"><div class="ic">'+k.icon+'</div><div><h3>'+k.title+'</h3><p class="small">Found in '+ROOMS[i].name+'</p>'+k.body()+'</div></div>'; }
function kitModal(html){ $('kitPanel').innerHTML=html+'<div class="row" style="margin-top:12px"><button class="go" id="kitClose">Back to the expedition</button></div>'; $('kitModal').classList.add('show'); $('kitClose').onclick=function(){$('kitModal').classList.remove('show');try{speechSynthesis.cancel();}catch(e){}}; setTimeout(function(){$('kitClose').focus();},0); }
function pickUp(){
  var s=st[at]; if(s.kit) return;
  if(!(isOpen(at)||s.side)){ $('say').innerHTML='Something on the workbench catches your eye. It will be yours to take once you\'ve dealt with the lock — either way through.'; return; }
  s.kit=true; save(); kitCount(); var el=$('item'+at); if(el){el.classList.remove('ready');el.classList.add('taken');}
  kitModal('<h2 id="kt">You add the '+KIT[at].name+' to your field kit</h2><p class="sub">It comes with you through the workshop and into the unit. Looking things up in your kit is good practice, and it is never recorded.</p>'+toolCard(at));
  roomHud();
}
function showKit(){
  var have=ROOMS.map(function(r,i){return i;}).filter(function(i){return st[i].kit;});
  kitModal('<h2 id="kt">Your field kit</h2><p class="sub">Tools you have collected. Use them whenever they help, in the workshop and in the unit. Using your kit is never recorded.</p>'+
    (have.length?have.map(toolCard).join(''):'<p>Your kit is empty so far. Each room has a tool waiting on its workbench.</p>'));
}
function readNote(){
  var i=at===DOME?DOME-1:at;
  kitModal('<h2 id="kt">Did you know?</h2><p class="sub">'+ROOMS[i].name+' · just for interest: this is not part of the expedition</p><div class="didyou">'+NOTES[i]+'</div>'+('speechSynthesis' in window?'<div class="row" style="margin-top:10px"><button class="soft" id="noteRead">🔊 Read aloud</button></div>':''));
  if($('noteRead')) $('noteRead').onclick=function(){speak(NOTES[i]);};
}

/* ---------- The lock panel ---------- */
function speak(t){ try{ speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(t); u.lang='en-GB'; u.rate=.92; speechSynthesis.speak(u);}catch(e){} }
function openLock(){
  var r=ROOMS[at], s=st[at];
  var h='<h2 id="lt">'+r.name+'</h2><p class="sub">'+r.lesson+'</p><div class="q">'+r.q+'</div>';
  if('speechSynthesis' in window) h+='<div class="row"><button class="soft" id="readBtn">🔊 Read aloud</button></div>';
  h+='<div class="label">First, how does this lock look to you?</div><div class="row">'+[['sure','I\'ve got this'],['unsure','Not sure'],['new','This is new to me']].map(function(f){return '<button class="opt" data-feel="'+f[0]+'" aria-pressed="'+(s.feel===f[0])+'">'+f[1]+'</button>';}).join('')+'</div>';
  h+='<div class="'+(s.feel?'':'locked')+'"><div class="label">Now try a key</div><div class="row">'+(r.choices?r.choices.map(function(c){return '<button class="opt" data-key="'+esc(c)+'">'+esc(c)+'</button>';}).join(''):'<input class="ans" id="ans" autocomplete="off" aria-label="Your answer"><button class="go" id="tryBtn">Try the key</button>')+'</div></div>';
  var have=ROOMS.map(function(x,i){return i;}).filter(function(i){return st[i].kit;});
  if(have.length) h+='<details class="glass"><summary>🎒 Open my field kit ('+have.length+')</summary>'+have.map(toolCard).join('')+'</details>';
  h+='<div class="fb" id="fb" role="status"></div><div class="row noprint" style="margin-top:14px"><button class="soft" id="sideFromLock">Take the back stairs instead</button><button class="soft" id="closeLock">Step back</button></div>';
  $('lockPanel').innerHTML=h; $('lockModal').classList.add('show');
  if($('readBtn')) $('readBtn').onclick=function(){speak(r.speak);};
  [].forEach.call(document.querySelectorAll('[data-feel]'),function(b){b.onclick=function(){s.feel=b.dataset.feel;save();openLock();setTimeout(function(){var a=$('ans')||document.querySelector('[data-key]');if(a)a.focus();},0);};});
  if(r.choices) [].forEach.call(document.querySelectorAll('[data-key]'),function(b){b.onclick=function(){tryKey(b.dataset.key);};});
  else { $('tryBtn').onclick=function(){tryKey($('ans').value);}; $('ans').onkeydown=function(e){if(e.key==='Enter')tryKey(this.value);}; }
  $('sideFromLock').onclick=function(){closeLock();takeSide();}; $('closeLock').onclick=closeLock;
  setTimeout(function(){var f=document.querySelector('[data-feel]');if(f)f.focus();},0);
}
function closeLock(){ try{speechSynthesis.cancel();}catch(e){} $('lockModal').classList.remove('show'); roomHud(); }
function fb(k,m){var f=$('fb');f.className='fb show '+k;f.innerHTML=m;}
function tryKey(v){
  var r=ROOMS[at], s=st[at]; if(!String(v).trim()) return;
  var res=r.choices?(v===r.answer?'right':v):r.check(v);
  if(res==='right'){
    s.result= s.result==='notyet'?'second':'right'; save();
    fb('good','<b>The key turns.</b> '+r.show);
    setTimeout(function(){closeLock();$('door'+at).style.transform+=' rotateY(-100deg)';$('lamp'+at).classList.add('gold');roomHud();},1700);
  } else {
    if(s.result===null && res!=='fmt') s.result='notyet';
    if(!s.signal && r.adult && r.adult[res]) s.signal=r.adult[res];
    save();
    var why=r.why&&r.why[res];
    fb('try',(why?why:'The key doesn\'t turn yet. '+r.hint)+' <button class="soft" id="showBtn">Show me how</button>');
    $('showBtn').onclick=function(){fb('calm',r.show+' You can try the key again, or take the back stairs. Either is fine.');};
  }
}
function takeSide(){ var s=st[at]; s.side=true; save(); $('arch'+at).classList.add('open'); $('lamp'+at).classList.add('blue'); roomHud(); }
function walkOn(){
  var viaDoor=isOpen(at), next=at+1;
  hud('…',[]);
  if(flat()){ at=next; place(at); save(); arrive(); return; }
  if(!viaDoor || still()){
    $('veil').classList.add('on');
    setTimeout(function(){at=next;world.style.transition='none';place(at);world.offsetWidth;world.style.transition='';save();setTimeout(function(){$('veil').classList.remove('on');arrive();},350);},950);
  } else { at=next; place(at,true); save(); setTimeout(function(){hideBehind();arrive();},2700); }
}
function arrive(){ roomHud(); if(at===DOME) setTimeout(showPlan, flat()?0:1200); }

/* ---------- Workshop plan and the adult view ---------- */
function outcome(i){ var s=st[i];
  if(s.result==='right') return s.feel==='sure'?'ready':'strength';
  if(s.result==='second') return 'refresh';
  if(s.result==='notyet' && s.feel==='sure') return 'look';
  if(s.result===null && !s.side) return 'unvisited';
  return 'new'; }
var OUT={ready:'Ready',strength:'Hidden strength',refresh:'Got there with a nudge',look:'Worth a second look',new:'New ground',unvisited:'Not visited yet'};
var LEARN={ready:'You\'re carrying what this lesson needs.',strength:'You knew more than you thought.',refresh:'A quick refresh before this lesson would help.',look:'Worth another look before the lesson.',new:'We\'ll build this together in the lesson.',unvisited:'Waiting for you.'};
function showPlan(){
  var o=ROOMS.map(function(r,i){return outcome(i);}), done=at===DOME;
  var feelTxt={sure:'I\'ve got this',unsure:'Not sure',new:'This is new to me',null:'—'};
  var h='<h2 id="pt">Your workshop plan</h2><p class="sub">Formulae and Rearranging · Year 9 · Spring term</p><p>'+(done?'Gold lamps are doors you unlocked. Blue lanterns mark rooms we\'ll explore together in the unit.':'Your walk so far. You can carry on whenever you like.')+'</p><div class="plan">'+
    ROOMS.map(function(r,i){var c=isOpen(i)?'gold':st[i].side||o[i]==='new'||o[i]==='look'?'blue':o[i]==='unvisited'?'unvisited':'';
      return '<div class="roomcard '+c+'"><div class="lampdot"></div><b>'+r.name+'</b><small>'+r.lesson.replace(/^Lesson (\d) · /,'Lesson $1: ')+'</small><small><b>'+OUT[o[i]]+'</b> · '+LEARN[o[i]]+'</small></div>';}).join('')+
    '<div class="roomcard"><div class="lampdot" style="border-radius:4px;background:#2b4470"></div><b>The Showroom</b><small>'+(done?'Reached':'At the end of the workshop')+'</small></div></div>';
  var routes=ROOMS.filter(function(r,i){return ['look','new','refresh'].indexOf(o[i])>=0;}).map(function(r){return r.route;});
  routes=routes.filter(function(x,i){return routes.indexOf(x)===i;});
  h+= routes.length?'<div class="pack"><b>Your packing list</b><p>Short Reconnection Routes to try before the unit starts. Each one takes about ten minutes and brings you straight back.</p><ul>'+routes.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></div>'
    : (done?'<div class="pack"><b>Your packing list is empty.</b> You\'re carrying everything this unit builds on. Enjoy the journey.</div>':'');
  var have=ROOMS.map(function(r,i){return i;}).filter(function(i){return st[i].kit;}), missed=ROOMS.map(function(r,i){return i;}).filter(function(i){return !st[i].kit;});
  h+='<div class="label">Your field kit for this unit</div>'+(have.length?'<ul class="kitlist">'+have.map(function(i){return '<li>'+KIT[i].title+'</li>';}).join('')+'</ul>':'<p class="small">Empty so far.</p>')+
     (missed.length&&done?'<p class="small">Still waiting on a workbench: '+missed.map(function(i){return KIT[i].title+' ('+ROOMS[i].name+')';}).join(', ')+'. Your supporting adult can give you these at the start of the unit.</p>':'');
  if(done) h+='<div class="label">How do you feel about starting this unit? (Optional — only kept if you choose to share it.)</div><textarea id="feelText" placeholder="Anything you\'d like your supporting adult to know…"></textarea><div class="row noprint" style="margin-top:6px"><button class="soft" id="shareFeel">Share this with my supporting adult</button><span id="feelStatus" class="small"></span></div>';
  h+='<details class="glass" id="adultDetails"><summary>See exactly what your supporting adult sees</summary><p class="small">The same information as your workshop plan. No scores, no times, no attempt counts.</p><table class="adult"><tr><th>Room · lesson</th><th>How the lock looked</th><th>Outcome</th><th>What it might suggest</th><th>Suggested route</th></tr>'+
    ROOMS.map(function(r,i){var x=o[i];return '<tr><td>'+r.name+'<br><span class="small">'+r.lesson+'</span></td><td>'+feelTxt[st[i].feel]+'</td><td>'+OUT[x]+'</td><td>'+(st[i].signal?esc(st[i].signal):(x==='strength'?'Felt unsure but was right: worth saying out loud.':x==='new'&&st[i].side?'Chose to learn this in the unit.':'—'))+'</td><td>'+(['look','new','refresh'].indexOf(x)>=0?esc(r.route):'—')+'</td></tr>';}).join('')+
    '</table><p class="small"><b>For the adult:</b> "Worth a second look" (felt sure, not yet right) is the most useful signal; it often points to a misconception worth a conversation. "Hidden strength" is worth saying out loud. Outcomes use the learner\'s own words and never a score.</p></details>';
  h+='<div class="row noprint"><button class="go" id="closePlan">'+(done?'Back to the Showroom':'Back to the expedition')+'</button><button class="soft" id="printPlan">Print or save this workshop plan</button>'+(done?'<button class="soft" id="againBtn">Start a new expedition</button>':'')+'</div>';
  h+='<div id="saveStatus" class="pack noprint" style="margin-top:12px">'+(done?'Saving your workshop plan to your learner record…':'Your workshop plan is saved when you reach the Showroom.')+'</div>';
  h+='<p class="small" style="margin-top:12px">NEO Maths results service · Inventor’s Workshop v0.1</p>';
  $('planPanel').innerHTML=h; $('planModal').classList.add('show');
  $('closePlan').onclick=function(){$('planModal').classList.remove('show');};
  $('printPlan').onclick=function(){$('adultDetails').open=true;window.print();};
  if($('againBtn')) $('againBtn').onclick=function(){forget();location.reload();};
  if($('shareFeel')) $('shareFeel').onclick=shareFeeling;
  if(done) record();
}

/* ---------- Saving to the learner record (NEO results service) ---------- */
function served(){ return typeof google!=='undefined' && google.script && google.script.run; }
function passportLink(){ return (typeof NEO_APP_URL==='string'&&NEO_APP_URL)?' <a href="'+NEO_APP_URL+'?page=passport" target="_top">Open my learner passport</a>.':''; }
function record(){
  var box=$('saveStatus'); if(!box) return;
  if(!served()){ box.innerHTML='This copy is not connected to the NEO results service, so nothing has been saved. Open the expedition from your NEO link to save it.'; return; }
  var feelTxt={sure:'I\'ve got this',unsure:'Not sure',new:'This is new to me'};
  var rooms=ROOMS.map(function(r,i){ var x=outcome(i);
    return {room:r.name, lesson:r.lesson, felt:feelTxt[st[i].feel]||'', outcome:OUT[x],
      suggests:st[i].signal||(x==='strength'?'Felt unsure but was right: worth saying out loud.':x==='new'&&st[i].side?'Chose to learn this in the unit.':''),
      route:['look','new','refresh'].indexOf(x)>=0?r.route:''}; });
  google.script.run
    .withSuccessHandler(function(){ box.innerHTML='<b>Saved to your learner record ✓</b>'+passportLink(); })
    .withFailureHandler(function(){ box.innerHTML='Your workshop plan could not be saved just now. It is still here. <button class="soft" id="saveAgain">Try saving again</button>'; $('saveAgain').onclick=function(){box.innerHTML='Saving…';record();}; })
    .saveDiagnostic({unit:UNIT.name, unitId:UNIT.id, expedition:EXP, rooms:rooms});
}
function shareFeeling(){
  var t=($('feelText').value||'').trim(), out=$('feelStatus');
  if(!t){ out.textContent='Write something first, or leave it empty: it is optional.'; return; }
  if(!served()){ out.textContent='This copy is not connected, so it cannot be shared from here.'; return; }
  out.textContent='Sharing…';
  google.script.run.withSuccessHandler(function(){ out.textContent='Shared with your supporting adult ✓'; })
    .withFailureHandler(function(){ out.textContent='Could not share just now. Please try again.'; })
    .saveComment({unit:UNIT.name, unitId:UNIT.id, expedition:EXP, comment:t});
}

/* ---------- Welcome ---------- */
function welcome(){
  var saved=load();
  var h='<h2 id="wt">Welcome to the Inventor\'s Workshop</h2><p class="sub">Formulae and Rearranging · Year 9 · before you set off</p>'+
   '<div class="info"><p><b>This is an expedition, not a test.</b> There is no clock, no score and nothing to lose. It takes about 15 to 20 minutes, and you can stop and come back.</p>'+
   '<p>There are six rooms, one for each lesson in the unit. Each has a locked door, and the right answer is the key. If a lock looks unfamiliar, every room also has <b>back stairs</b> that lead on just the same. Taking them is a good choice: it tells us what to help you with.</p><p>In every room you will also find a <b>tool for your field kit</b> on the workbench. It comes with you into the unit, and looking things up in it is never recorded.</p></div>'+
   '<details class="glass"><summary>What is saved, and who can see it?</summary><p>Only your answers and how each lock looked to you. Nothing else: not how long you took, not how many tries, not what you clicked.</p><p>When you reach the Showroom, your workshop plan is saved to your <b>NEO learner record</b>, in a spreadsheet that NEO keeps in its own Google Drive. Your supporting adult and NEO maths staff can see it, and they see exactly the workshop plan you see. You can always see it too, in your <b>learner passport</b>.</p><p>Your comment at the end is only saved if you choose to share it.</p></details>'+
   '<p>If moving between rooms feels uncomfortable, choose <b>Still mode</b>: rooms change with a gentle fade and nothing moves. <b>Flat view</b> shows just the questions, with no 3D at all. Every question has a <b>Read aloud</b> button. You can change any of these from the top bar at any time.</p>'+
   '<div class="row">'+(saved?'<button class="go" id="contBtn">Continue where you left off</button><button class="soft" id="newBtn">Start a new expedition</button>':'<button class="go" id="enterBtn">Step inside</button><button class="soft" id="enterStillBtn">Step inside in Still mode</button><button class="soft" id="enterFlatBtn">Use Flat view</button>')+'</div>';
  $('welcomePanel').innerHTML=h;
  function go(){ $('welcome').classList.remove('show'); world.style.transition='none'; place(at); world.offsetWidth; world.style.transition=''; roomHud(); }
  if(saved){ $('contBtn').onclick=function(){st=saved.st;at=saved.at;restoreScene();go();}; $('newBtn').onclick=function(){forget();st=fresh();at=0;go();}; }
  else { $('enterBtn').onclick=go; $('enterStillBtn').onclick=function(){setStill(true);go();}; $('enterFlatBtn').onclick=function(){setFlat(true);go();}; }
}
place(0); welcome();
$('kitBtn').onclick=function(){ if(!$('welcome').classList.contains('show')) showKit(); };
$('planBtn').onclick=function(){ if(!$('welcome').classList.contains('show')) showPlan(); };
$('stillBtn').onclick=function(){setStill(!still());};
$('flatBtn').onclick=function(){setFlat(!flat());};
$('comfortBtn').onclick=function(){var on=document.body.classList.toggle('comfort');this.setAttribute('aria-pressed',on);};
document.addEventListener('keydown',function(e){ if(e.key==='Escape'){ if($('lockModal').classList.contains('show')) closeLock(); else { $('planModal').classList.remove('show'); $('kitModal').classList.remove('show'); } } });
</script>
</body>
</html>
