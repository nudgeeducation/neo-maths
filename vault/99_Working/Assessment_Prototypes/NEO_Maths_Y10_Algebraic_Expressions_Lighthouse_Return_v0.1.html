<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Return to the Lighthouse · Algebraic Expressions</title>
<style>
:root{--ink:#2f3429;--paper:#f7f3ea;--h1:#3f5f45;--h2:#6a7f4e;--gold:#d8b26e;--teal:#2AB3A0;--blue:#365a68;--night:#0f1a24;
--ready:#e3f0df;--strength:#e5eef2;--refresh:#fff1cf;--new:#f1e9dc}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--night);font-family:Arial,sans-serif;color:var(--ink);overflow:hidden}
body.comfort{font-size:1.15em;letter-spacing:.02em}
body.comfort .panel,body.comfort .hud{line-height:1.75}
.top{position:fixed;inset:0 0 auto 0;height:52px;background:#1b2b3a;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 14px;gap:10px;z-index:30}
.top b{color:#7fd8cc;letter-spacing:.12em;font-size:.8em;white-space:nowrap}
.top .tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.top button{background:#2b4152;color:#fff;border:1px solid #4d6577;border-radius:8px;padding:6px 10px;font-weight:700;cursor:pointer;font-size:.82em}
.top button[aria-pressed=true]{background:var(--teal);color:#08201d;border-color:var(--teal)}

/* 3D scene */
#vp{position:fixed;top:52px;left:0;right:0;bottom:0;overflow:hidden;perspective:900px;perspective-origin:50% 40%}
#world{position:absolute;left:50%;top:46%;width:0;height:0;transform-style:preserve-3d;transition:transform 2.6s cubic-bezier(.45,.05,.35,1)}
body.still #world{transition:none}
body.flat #vp,body.flat #veil{display:none}
body.flat{background:#efe9df;overflow:auto}
body.flat .hud{position:static;transform:none;margin:76px auto 20px}
.f{position:absolute;transform-style:preserve-3d}
.wall{background:repeating-linear-gradient(0deg,rgba(90,80,60,.10) 0 2px,transparent 2px 70px),linear-gradient(180deg,#efe9dc 0%,#e0d6c2 55%,#c9bca2 100%);box-shadow:inset 0 0 120px rgba(40,30,15,.30)}
.wall.side{background:repeating-linear-gradient(0deg,rgba(90,80,60,.10) 0 2px,transparent 2px 70px),linear-gradient(90deg,#cfc3a8 0%,#ebe4d4 100%)}
.wall.side.r{background:repeating-linear-gradient(0deg,rgba(90,80,60,.10) 0 2px,transparent 2px 70px),linear-gradient(270deg,#cfc3a8 0%,#ebe4d4 100%)}
.floor{background:repeating-linear-gradient(90deg,#6d4e33 0 118px,#5e422b 118px 120px),#6d4e33;box-shadow:inset 0 0 220px rgba(0,0,0,.5)}
.floor.tiles{background:repeating-conic-gradient(#9a907e 0 25%,#7d7362 0 50%) 0 0/120px 120px;box-shadow:inset 0 0 220px rgba(0,0,0,.5)}
.ceiling{background:repeating-linear-gradient(90deg,#5e422b 0 34px,#7a5a3c 34px 220px)}
.prop{position:absolute;left:50%;top:50%;transform:translate(-50%,-55%)}
.p-port{width:280px;height:280px;border-radius:50%;border:20px solid #8a8f94;box-shadow:inset 0 0 0 6px #5c6670,0 0 30px rgba(120,170,220,.3);background:radial-gradient(circle at 72% 30%,#fff6d0 0 16px,transparent 18px),linear-gradient(#9cc7e4 0 56%,#2f6d8f 56% 100%)}
.p-crates{display:flex;gap:18px;align-items:flex-end;height:320px}
.p-crates i{display:block;width:130px;background:repeating-linear-gradient(90deg,#a3744a 0 28px,#8a5f37 28px 32px);border:7px solid #5a3b22}
.p-crates i:nth-child(1){height:130px}.p-crates i:nth-child(2){height:200px}.p-crates i:nth-child(3){height:120px}
.p-crates b{display:block;width:110px;height:150px;border-radius:40px/18px;background:repeating-linear-gradient(0deg,#7a5233 0 30px,#3a2a10 30px 36px);border:6px solid #3a2a10}
.p-stair svg{display:block}
.p-chart svg{width:520px;height:330px;border:10px solid #8a6d40;border-radius:4px;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.p-dials{display:flex;gap:26px}
.p-dials i{display:block;width:130px;height:130px;border-radius:50%;border:10px solid #8f6a26;background:conic-gradient(from 200deg,#2f3429 0 2deg,transparent 2deg),repeating-conic-gradient(#3a2a10 0 1deg,transparent 1deg 15deg),radial-gradient(circle,#f7efd9 0 60%,#e6d5ae 61%);box-shadow:0 0 18px rgba(255,210,120,.35)}
.p-lens{width:300px;height:380px;border-radius:40px;border:14px solid #8f6a26;background:radial-gradient(circle,rgba(255,250,220,.95) 0 24px,transparent 26px),repeating-radial-gradient(circle,#eaf5fb 0 14px,#b7d4e4 14px 19px);box-shadow:0 0 40px rgba(180,220,255,.45)}
.p-gallery{width:600px;height:330px;border:14px solid #5c6670;border-radius:10px;background:radial-gradient(circle at 78% 34%,#fff1c2 0 26px,transparent 28px),linear-gradient(#f3c98b 0 32%,#9cc7e4 32% 58%,#2f6d8f 58% 100%);position:relative}
.p-gallery:after{content:"";position:absolute;left:0;right:0;bottom:0;height:120px;background:linear-gradient(#333 0 8px,transparent 8px),repeating-linear-gradient(90deg,transparent 0 44px,#333 44px 52px)}
.p-lamp{width:280px;height:380px;border-radius:130px 130px 18px 18px;border:12px solid #3a3a3a;background:radial-gradient(circle at 50% 56%,#fffbe6 0 46px,#f2c14e 80px,rgba(242,193,78,0) 150px),repeating-linear-gradient(90deg,transparent 0 56px,rgba(58,58,58,.8) 56px 62px),#2b3440;box-shadow:0 0 50px rgba(242,193,78,.45)}
.arch{position:absolute;left:50%;bottom:0;width:220px;height:380px;margin-left:-110px;border-radius:110px 110px 0 0;background:#2a1d14;overflow:hidden;border:10px solid #8a7a5c;border-bottom:0}
.arch .curtain{position:absolute;inset:0;background:repeating-linear-gradient(90deg,#2f5f7a 0 18px,#244c63 18px 30px);transition:transform 1.4s ease}
.arch.open .curtain{transform:translateY(-100%)}
.arch .glow{position:absolute;inset:0;background:radial-gradient(circle at 50% 75%,rgba(255,200,110,.55),transparent 60%)}
.door{background:repeating-linear-gradient(90deg,#2f5f7a 0 46px,#264f66 46px 50px);border:8px solid #1d3a4c;transform-origin:0 50%;transition:transform 1.8s ease;cursor:pointer}
body.still .door{transition:none}
.door .lock{position:absolute;right:26px;top:48%;width:46px;height:62px;border-radius:10px;background:linear-gradient(#e4c27a,#a9802f);box-shadow:0 0 0 3px #6b5020,0 0 18px rgba(255,210,120,.5)}
.door .lock:after{content:"";position:absolute;left:18px;top:20px;width:10px;height:22px;border-radius:5px;background:#3a2614}
.lintel{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.plaque{background:linear-gradient(#e9d7a8,#c9ad6c);color:#3a2a10;font-family:Georgia,serif;font-weight:700;font-size:26px;padding:8px 26px;border-radius:6px;box-shadow:0 2px 0 #7a6243;white-space:nowrap}
.lamp{width:44px;height:44px;border-radius:50%;background:#6f6a60;box-shadow:inset 0 -6px 0 rgba(0,0,0,.25);transition:all 1.2s}
.lamp.gold{background:radial-gradient(circle,#fff5c9,#f2c14e 60%,#c58a1c);box-shadow:0 0 30px 12px rgba(242,193,78,.7)}
.lamp.blue{background:radial-gradient(circle,#e8f6ff,#7fb6e0 60%,#3f7aa8);box-shadow:0 0 30px 12px rgba(127,182,224,.6)}
.seaview{position:absolute;left:50%;top:6%;width:900px;height:520px;margin-left:-450px;border-radius:40px;border:16px solid #5c6670;overflow:hidden;background:radial-gradient(circle at 82% 22%,#fff8d8 0 22px,transparent 24px),radial-gradient(circle at 20% 30%,#fff 0 2px,transparent 3px),radial-gradient(circle at 55% 18%,#fff 0 1.5px,transparent 2.5px),linear-gradient(#0b1626 0 58%,#163a55 58% 100%)}
.seaview .beam{position:absolute;left:50%;top:44%;width:760px;height:180px;margin-top:-90px;transform-origin:0 50%;background:linear-gradient(90deg,rgba(255,240,180,.9),rgba(255,240,180,0));clip-path:polygon(0 45%,100% 0,100% 100%,0 55%);animation:sweep 7s ease-in-out infinite alternate}
@keyframes sweep{from{transform:rotate(-18deg)}to{transform:rotate(10deg)}}
body.still .seaview .beam{animation:none}
@media (prefers-reduced-motion:reduce){.seaview .beam{animation:none}}
.biglamp{position:absolute;left:50%;bottom:0;width:240px;height:300px;margin-left:-120px;border-radius:120px 120px 16px 16px;border:12px solid #3a3a3a;background:radial-gradient(circle at 50% 55%,#fffbe6 0 50px,#f2c14e 90px,rgba(242,193,78,0) 150px),#2b3440;box-shadow:0 0 70px rgba(242,193,78,.6)}

/* Furniture, field-kit objects and notes */
.desk svg,.plant svg{width:100%;height:100%;display:block}
.item{cursor:pointer;transition:opacity 1s,filter .6s}
.item svg{width:100%;height:100%}
.item.ready{filter:drop-shadow(0 0 14px rgba(255,220,130,.95))}
.item.taken{opacity:0;pointer-events:none}
.rug{border-radius:16px;box-shadow:0 0 0 14px rgba(0,0,0,.08)}
.note{position:absolute;left:60px;top:250px;width:150px;height:110px;background:#f3e6c4;border:6px solid #8a6d40;border-radius:4px;font-family:Georgia,serif;font-size:21px;font-weight:700;color:#3a2a10;display:grid;place-items:center;text-align:center;cursor:pointer;transform:rotate(-3deg);box-shadow:0 4px 0 rgba(0,0,0,.25)}
.note:before{content:"";position:absolute;top:-12px;left:66px;width:14px;height:14px;border-radius:50%;background:#b0412f}

/* HUD and panels */
#veil{position:fixed;inset:52px 0 0 0;background:#000;opacity:0;pointer-events:none;transition:opacity .9s;z-index:5}
#veil.on{opacity:1}
.hud{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(780px,calc(100% - 24px));background:rgba(247,243,234,.97);border-radius:16px;padding:12px 16px 14px;z-index:10;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.where{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.where .room{font-weight:700;color:var(--h1)}
.where .leads{font-size:.88em;color:#5c6b4f}
.dots{display:flex;gap:6px;align-items:center}
.dots i{width:13px;height:13px;border-radius:50%;background:#d9d2c4;border:2px solid #b9ae98}
.dots i.gold{background:#f2c14e;border-color:#c58a1c}.dots i.blue{background:#7fb6e0;border-color:#3f7aa8}
.dots i.here{outline:3px solid var(--teal);outline-offset:1px}
.dots i.domedot{border-radius:3px}
.hud .say{margin:0 0 10px;font-size:1.05em}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button.go,button.opt,button.soft{padding:9px 14px;border-radius:10px;border:1px solid #738697;background:#fff;cursor:pointer;font-weight:600;color:var(--ink);font-size:1em}
button.go{background:var(--blue);color:#fff;border-color:var(--blue)}
button.soft{border-style:dashed;color:#5c6b4f}
button.opt[aria-pressed=true]{background:var(--h1);color:#fff;border-color:var(--h1)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.modal{position:fixed;inset:52px 0 0 0;display:none;align-items:center;justify-content:center;z-index:20;background:rgba(10,16,24,.55);padding:16px}
.modal.show{display:flex}
.panel{background:var(--paper);border-radius:18px;padding:20px 22px;width:min(680px,100%);max-height:calc(100vh - 90px);overflow:auto}
.panel h2{color:var(--h1);margin:0 0 4px}
.panel .sub{color:#5c6b4f;margin:0 0 10px;font-size:.92em}
.panel .q{font-size:1.25em;margin:6px 0 12px}.big{font-family:Georgia,'Times New Roman',serif;font-size:1.25em;white-space:nowrap}
.label{font-weight:700;color:#5c6b4f;margin:12px 0 6px}
input.ans{font-size:1.15em;padding:8px 10px;border-radius:8px;border:1px solid #738697;width:10em}
.locked{opacity:.45;pointer-events:none}
.fb{margin-top:12px;padding:12px 14px;border-radius:10px;display:none}
.fb.show{display:block}.fb.good{background:var(--ready)}.fb.try{background:var(--refresh)}.fb.calm{background:var(--strength)}
.info{background:#fffaf0;padding:12px 14px;border-left:6px solid var(--gold);border-radius:10px;margin:12px 0}
.glass{background:#e5eef2;padding:10px 14px;border-radius:10px;margin:10px 0;font-size:.95em}
.glass summary{font-weight:700;cursor:pointer}
.plan{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
.roomcard{border-radius:12px;padding:10px;background:#fff;border:3px solid #d9d2c4;text-align:center;font-size:.92em}
.roomcard .lampdot{width:20px;height:20px;border-radius:50%;margin:0 auto 6px;background:#c9c2b4}
.roomcard.gold{border-color:#f2c14e}.roomcard.gold .lampdot{background:#f2c14e;box-shadow:0 0 12px #f2c14e}
.roomcard.blue{border-color:#7fb6e0}.roomcard.blue .lampdot{background:#7fb6e0;box-shadow:0 0 12px #7fb6e0}
.roomcard.unvisited{opacity:.6}
.roomcard small{display:block;color:#5c6b4f;margin-top:4px}
.pack{background:var(--new);border-radius:12px;padding:10px 14px}
table.adult{width:100%;border-collapse:collapse;font-size:.88em;background:#fff}
table.adult th,table.adult td{border:1px solid #d9d2c4;padding:6px 8px;text-align:left;vertical-align:top}
table.adult th{background:#eef3e8}
textarea{width:100%;min-height:60px;border-radius:8px;border:1px solid #738697;padding:8px;font:inherit}
.small{font-size:.85em;color:#5c6b4f}
.tool{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:start;background:#fff;border-radius:12px;padding:12px 14px;margin:10px 0}
.tool .ic svg{width:72px;height:72px}
.tool h3{margin:0 0 4px;color:var(--h1);font-size:1.05em}
.tool p{margin:4px 0}
.tool table.sq{border-collapse:collapse;font-size:.95em}
.tool table.sq td{border:1px solid #d9d2c4;padding:3px 7px;text-align:center}
.kitlist{columns:2;margin:6px 0 0;padding-left:18px}
.didyou{background:#fffaf0;border-left:6px solid var(--gold);border-radius:10px;padding:12px 14px;font-size:1.05em}
@media (max-width:700px){.plan{grid-template-columns:repeat(2,1fr)}.top b{display:none}}
@media print{body{overflow:visible;background:#fff}.top,#vp,#veil,.hud,.noprint{display:none!important}.modal{position:static;display:block;background:none;padding:0}.modal:not(#planModal){display:none!important}.panel{max-height:none;box-shadow:none}details{display:block}details>*{display:block}}

.mathpalette{margin:8px 0 0;flex-basis:100%}
.palette-toggle{background:#365a68;color:#fff;border:none;padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:15px}
.palette-keys{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.palette-keys[hidden]{display:none}
.palette-keys button{min-width:44px;padding:8px 10px;font-size:1.1em;background:#fff;border:1px solid #bcae98;border-radius:8px;cursor:pointer;color:#2f3429}
.palette-keys button:focus-visible,.palette-toggle:focus-visible{outline:3px solid #f2c14e;outline-offset:2px}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .15em;line-height:1.2}
.fr>span{display:block;padding:0 .25em}
.fr>span:first-child{border-bottom:2px solid currentColor}
.readas{flex-basis:100%;margin-top:6px;font-size:1.05em}
.readas:empty{display:none}
.ralabel{font-size:.8em;opacity:.75;margin-right:4px}
.f.item{visibility:hidden!important}

.journey{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;justify-content:center;margin-top:4px}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:rgba(0,0,0,.08)}
.chip.now{background:#2f5f7a;color:#fff}
.roomcard.gold .chip.now{background:#8f6a26}
.exam{border:1px solid rgba(0,0,0,.15);border-radius:10px;padding:10px 12px;margin:10px 0;background:rgba(255,255,255,.55)}
.exam .marks{font-size:12px;opacity:.75}
.confirm{border:2px solid #8f6a26;border-radius:10px;padding:10px 14px;margin-top:12px;background:rgba(255,248,230,.7)}
.confirm label{display:block;margin:6px 0;cursor:pointer}
.confirm label small{display:block;opacity:.8;margin-left:24px}
.judged{border-left:5px solid #8f6a26;padding:6px 12px;margin:10px 0;background:rgba(255,248,230,.7)}
</style>
</head>
<body>
<div class="top"><b>NEO MATHS · RETURN TO THE LIGHTHOUSE</b>
  <div class="tools">
    <button id="kitBtn" title="The tools you have collected">Field kit · <span id="kitCount">0</span></button>
    <button id="planBtn" title="See your floor plan at any time">Floor plan</button>
    <button id="stillBtn" aria-pressed="false" title="No movement: floors change with a gentle fade">Still mode</button>
    <button id="flatBtn" aria-pressed="false" title="No 3D at all: just the questions, one floor at a time">Flat view</button>
    <button id="comfortBtn" aria-pressed="false" title="Larger text and more space">Aa Comfort</button>
  </div></div>
<div id="vp" aria-hidden="true"><div id="world"></div></div>
<div id="veil"></div>

<div class="hud" id="hud">
  <div class="where"><div><span class="room" id="roomName"></span> <span class="leads" id="leads"></span></div><div class="dots" id="dots" aria-hidden="true"></div></div>
  <p class="say" id="say" aria-live="polite"></p>
  <div class="row" id="acts"></div>
</div>

<div class="modal show" id="welcome" role="dialog" aria-modal="true" aria-labelledby="wt"><div class="panel" id="welcomePanel"></div></div>
<div class="modal" id="lockModal" role="dialog" aria-modal="true" aria-labelledby="lt"><div class="panel" id="lockPanel"></div></div>
<div class="modal" id="kitModal" role="dialog" aria-modal="true" aria-labelledby="kt"><div class="panel" id="kitPanel"></div></div>
<div class="modal" id="planModal" role="dialog" aria-modal="true" aria-labelledby="pt"><div class="panel" id="planPanel"></div></div>

<script>window.NEO_PALETTE_SYMBOLS=["x", "y", "n", "²", "³", "−", "+", "(", ")", "="];</script>
<script id="neoPalette">
/* NEO symbols palette for expeditions (same keys and preview as the lessons). Symbols: window.NEO_PALETTE_SYMBOLS */
var NEOPalette=(function(){
  function esc(t){ return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function F(n,d){ return '<span class="fr"><span>'+n+'</span><span>'+d+'</span></span>'; }
  // How a typed answer is read: everything after "/" up to the next + or - is the denominator.
  function readAs(v){
    var s=String(v).trim(); if(!s||s.indexOf('/')<0) return '';
    s=s.replace(/\s+/g,'').replace(/[−–]/g,'-').replace(/\*/g,'').replace(/÷/g,'/').replace(/\^2/g,'²').replace(/\^3/g,'³');
    var lead=''; var m=s.match(/^([a-z]=)/i); if(m){ lead=m[1]; s=s.slice(2); }
    function strip(t){ if(t.charAt(0)==='('&&t.charAt(t.length-1)===')'){ var d=0; for(var k=0;k<t.length-1;k++){ if(t.charAt(k)==='(') d++; else if(t.charAt(k)===')') d--; if(d===0) return t; } return t.slice(1,-1); } return t; }
    function show(t){ return esc(t).replace(/([a-z])/g,'<i>$1</i>').replace(/-/g,' − ').replace(/\+/g,' + ').replace(/^ − /,'−'); }
    var terms=[], cur='', d=0;
    for(var i=0;i<s.length;i++){ var c=s.charAt(i); if(c==='(') d++; if(c===')') d--; if(d===0&&(c==='+'||c==='-')&&i>0&&'/('.indexOf(s.charAt(i-1))<0){ terms.push(cur); cur=c; } else cur+=c; }
    terms.push(cur);
    var html=terms.map(function(t){ var sign=''; if(t.charAt(0)==='+'||t.charAt(0)==='-'){ sign=t.charAt(0)==='+'?' + ':' − '; t=t.slice(1); }
      var dd=0, at=-1; for(var k=0;k<t.length;k++){ var ch=t.charAt(k); if(ch==='(') dd++; else if(ch===')') dd--; else if(ch==='/'&&dd===0){ at=k; break; } }
      return sign+(at<0?show(t):F(show(strip(t.slice(0,at))),show(strip(t.slice(at+1))))); }).join('');
    return '<span class="ralabel">Reads as:</span> '+(lead?'<i>'+lead.charAt(0)+'</i> = ':'')+html; }
  function insert(f,s){ f.focus(); var a=f.selectionStart,b=f.selectionEnd; if(a==null){a=b=f.value.length;} f.value=f.value.slice(0,a)+s+f.value.slice(b); var p=a+s.length; try{f.selectionStart=f.selectionEnd=p;}catch(e){} f.focus(); }
  function attach(f){ if(!f||f.dataset.paletteReady) return; f.dataset.paletteReady='1';
    var w=document.createElement('div'); w.className='mathpalette';
    var t=document.createElement('button'); t.type='button'; t.className='palette-toggle'; t.textContent='√ Symbols'; t.setAttribute('aria-expanded','false');
    var k=document.createElement('div'); k.className='palette-keys'; k.hidden=true;
    var pv=document.createElement('div'); pv.className='readas'; pv.setAttribute('aria-live','polite');
    function upd(){ pv.innerHTML=readAs(f.value); }
    (window.NEO_PALETTE_SYMBOLS||[]).forEach(function(s){ var b=document.createElement('button'); b.type='button'; b.textContent=s; b.setAttribute('aria-label','Insert '+s); b.onclick=function(){ insert(f,s); upd(); }; k.appendChild(b); });
    var fr=document.createElement('button'); fr.type='button'; fr.title='Insert a fraction bar (numerator / denominator)'; fr.setAttribute('aria-label','Insert a fraction bar');
    fr.innerHTML=F('a','b'); fr.onclick=function(){ insert(f,'/'); upd(); }; k.appendChild(fr);

 machine:'<svg viewBox="0 0 100 100"><rect x="26" y="26" width="48" height="48" rx="6" fill="#9aa5ad" stroke="#5c6670" stroke-width="3"/><text x="50" y="56" font-size="16" text-anchor="middle" fill="#1b2b3a" font-family="Georgia">f</text><path d="M6 50H24M76 50H94" stroke="#3a2a10" stroke-width="4"/><path d="M18 44 L24 50 L18 56 M88 44 L94 50 L88 56" fill="none" stroke="#3a2a10" stroke-width="4"/></svg>'
};
var KIT=[
 {name:'substitution scroll', title:'Substitution scroll', icon:IC.scroll, body:function(){return '<p><b>Put the number in brackets wherever the letter appears.</b></p><p>If <i>x</i> = −3, then <i>x</i>² − 4<i>x</i> = (−3)² − 4 × (−3) = 9 + 12 = 21.</p><p>A negative number squared is positive. Subtracting a negative is adding.</p>';}},
 {name:'bracket hook', title:'Bracket hook', icon:IC.hook, body:function(){return '<p><b>Multiply every term inside the bracket.</b></p><p>4(3<i>x</i> − 2) = 12<i>x</i> − 8</p><p><b>Factorising</b> runs it backwards: find the common factor and take it outside. 12<i>x</i> − 8 = 4(3<i>x</i> − 2).</p>';}},
 {name:'grid net', title:'Grid net', icon:IC.net, body:function(){return '<p><b>Double brackets: every term times every term.</b></p><p>(<i>x</i> + 3)(<i>x</i> + 2): the grid cells are <i>x</i>², 2<i>x</i>, 3<i>x</i> and 6, so the answer is <i>x</i>² + 5<i>x</i> + 6.</p><p>Write the signs in the grid too: −2 stays −2.</p>';}},
 {name:'factor compass', title:'Factor compass', icon:IC.compass, body:function(){return '<p><b>To factorise <i>x</i>² + <i>bx</i> + <i>c</i>:</b> find two numbers that multiply to make <i>c</i> and add to make <i>b</i>.</p><p><i>x</i>² + 7<i>x</i> + 10: 2 × 5 = 10 and 2 + 5 = 7, so it is (<i>x</i> + 2)(<i>x</i> + 5).</p><p>Check by expanding.</p>';}},
 {name:'keeper’s logbook', title:'Keeper’s logbook', icon:IC.log, body:function(){return '<p><b>To add or subtract fractions, give them a common denominator first.</b></p><p>1/2 + 1/3 = 3/6 + 2/6 = 5/6</p><p>Change the numerator by the same factor as the denominator: 1/3 = 2/6, because both were multiplied by 2.</p>';}},
 {name:'balance scales', title:'Balance scales', icon:IC.scales, body:function(){return '<p><b>To change the subject, do the same to both sides.</b></p><p>Undo the steps in reverse order. <i>p</i> = 4<i>q</i> − 5: add 5 to both sides, then divide both sides by 4, so <i>q</i> = (<i>p</i> + 5)/4.</p>';}},
 {name:'odd-and-even lantern', title:'Odd-and-even lantern', icon:IC.lantern, body:function(){return '<p><b>Any even number can be written 2<i>n</i>. Any odd number can be written 2<i>n</i> + 1.</b></p><p>Consecutive whole numbers: <i>n</i>, <i>n</i> + 1, <i>n</i> + 2.</p><p>Testing examples suggests a rule; writing it in algebra proves it for every number.</p>';}},
 {name:'function machine', title:'Function machine', icon:IC.machine, body:function(){return '<p><b>A rule turns each input into one output.</b></p><p>Rule: double, then subtract 3. Input 5 → 5 × 2 = 10 → 10 − 3 = 7.</p><p>In algebra: <i>y</i> = 2<i>x</i> − 3.</p>';}}
];
var NOTES=[
 'The word <i>algebra</i> comes from <i>al-jabr</i>, in a book written in Baghdad around 820 by the mathematician al-Khwārizmī. It meant “restoring”: moving a term to the other side of an equation.',
 'The Pharos of Alexandria, one of the first lighthouses, was built around 280 BCE. It stood for well over a thousand years.',
 'Expanding (<i>x</i> + 1)³ gives <i>x</i>³ + 3<i>x</i>² + 3<i>x</i> + 1. The numbers 1, 3, 3, 1 are a row of Pascal’s triangle.',
 'Every lighthouse has its own pattern of flashes, called its <i>character</i>, so that sailors can tell one lighthouse from another at night.',
 'Music uses fractions too: a minim is half a semibreve, and a crotchet is a quarter. Two crotchets and a minim fill a bar of 4/4 exactly.',
 'In 1822 Augustin Fresnel designed a lens made of rings of glass. It bent the light into one strong beam that ships could see from many kilometres away.',
 'Around 300 BCE, Euclid proved that there is no largest prime number. His proof still works today, unchanged.',
 'A calculator shows an error for 1 ÷ 0. In the language of functions, 0 is not in the domain of “divide 1 by this number”.'
];
var RUGS=['#2f4f6b','#7b2f2f','#3f5f45','#6b4a7a','#7a5a2f','#2f5f5a','#6b3a2f','#3d4f7a'];
var DESK='<svg viewBox="0 0 300 150"><rect x="10" y="40" width="280" height="16" rx="3" fill="#7a5233"/><rect x="24" y="56" width="14" height="94" fill="#5a3b22"/><rect x="262" y="56" width="14" height="94" fill="#5a3b22"/><rect x="40" y="56" width="220" height="38" fill="#6b472b"/><rect x="132" y="68" width="36" height="8" rx="4" fill="#c9a35a"/><rect x="236" y="20" width="6" height="22" fill="#3a2a10"/><path d="M222 4 L256 4 L250 22 L228 22 Z" fill="#2f5f5a"/><ellipse cx="239" cy="40" rx="30" ry="8" fill="rgba(255,220,140,.35)"/></svg>';
var PLANT='<svg viewBox="0 0 150 260"><ellipse cx="55" cy="90" rx="20" ry="58" fill="#4d7a3f" transform="rotate(-22 55 90)"/><ellipse cx="95" cy="92" rx="20" ry="60" fill="#5f8a4e" transform="rotate(20 95 92)"/><ellipse cx="75" cy="70" rx="18" ry="66" fill="#41693a"/><ellipse cx="40" cy="140" rx="16" ry="40" fill="#5f8a4e" transform="rotate(-50 40 140)"/><ellipse cx="112" cy="140" rx="16" ry="40" fill="#4d7a3f" transform="rotate(50 112 140)"/><path d="M38 170 L112 170 L102 255 L48 255 Z" fill="#b5653f"/><rect x="32" y="162" width="86" height="16" rx="4" fill="#9a5233"/></svg>';

/* ---------- State, kept only on this device ---------- */
var KEY='neo-lighthouse-return-algebraic-expressions-v01';
function fresh(){return ROOMS.map(function(){return {feel:null,result:null,side:false,signal:null,kit:true};});}
var st=fresh(), at=0, opened=[];
function save(){try{localStorage.setItem(KEY,JSON.stringify({st:st,at:at}));}catch(e){}}
function load(){try{var d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&d.st&&d.st.length===ROOMS.length)return d;}catch(e){}return null;}
function forget(){try{localStorage.removeItem(KEY);}catch(e){}}

/* ---------- Building the rooms ---------- */
var D=1300,W=1200,H=700,L=1200,DW=280,DH=460, world=$('world'), building=0;
function face(w,h,tf,cls,html){var e=document.createElement('div');e.className='f '+cls;
  e.style.cssText='width:'+w+'px;height:'+h+'px;left:'+(-w/2)+'px;top:'+(-h/2)+'px;transform:'+tf;if(html)e.innerHTML=html;e.dataset.r=building;world.appendChild(e);return e;}
function build(i){
  building=i;
  var z=-i*D, zb=z-L/2, last=i===DOME, r=ROOMS[i]||{};
  face(W,L,'translate3d(0,'+H/2+'px,'+z+'px) rotateX(90deg)','floor '+(r.floor||''));
  face(W,L,'translate3d(0,'+(-H/2)+'px,'+z+'px) rotateX(-90deg)','ceiling');
  face(L,H,'translate3d('+(-W/2)+'px,0,'+z+'px) rotateY(90deg)','wall side', last?'<div class="prop p-port"></div>':r.prop);
  face(L,H,'translate3d('+(W/2)+'px,0,'+z+'px) rotateY(-90deg)','wall side r', last?'<div class="prop p-port"></div>':'<div class="arch" id="arch'+i+'"><div class="glow"></div><div class="curtain"></div></div>');
  if(last){ face(W,H,'translate3d(0,0,'+zb+'px)','wall','<div class="seaview"><div class="beam"></div></div><div class="biglamp"></div>'); return; }
  var pw=(W-DW)/2;
  var lw=face(pw,H,'translate3d('+(-(DW/2+pw/2))+'px,0,'+zb+'px)','wall','<div class="note" role="button" tabindex="-1">Did you<br>know?</div>');
  lw.querySelector('.note').onclick=function(){ if(i===at) readNote(); };
  face(pw,H,'translate3d('+(DW/2+pw/2)+'px,0,'+zb+'px)','wall');
  face(DW+2,H-DH,'translate3d(0,'+(-DH/2)+'px,'+zb+'px)','wall');
  face(560,170,'translate3d(0,'+(-DH/2-30)+'px,'+(zb+1)+'px)','lintel','<div class="plaque">'+r.name+'</div><div class="lamp" id="lamp'+i+'"></div>');
  var d=face(DW,DH,'translate3d(0,'+((H-DH)/2)+'px,'+zb+'px)','door','<div class="lock"></div>'); d.id='door'+i;
  d.onclick=function(){ if(i===at && !isOpen(i)) openLock(); };
  // Furniture kept to the edges, so the door and the desk stay the focus.
  var rug=face(640,420,'translate3d(0,'+(H/2-2)+'px,'+(z-40)+'px) rotateX(90deg)','rug'); rug.style.background='repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 10px,transparent 10px 40px),'+RUGS[i]; rug.style.border='10px solid rgba(233,215,168,.55)';
  face(300,150,'translate3d(-380px,'+(H/2-75)+'px,'+(z-330)+'px)','desk',DESK);
  var it=face(96,96,'translate3d(-420px,'+(H/2-150-40)+'px,'+(z-328)+'px)','item',KIT[i].icon); it.id='item'+i;
  it.onclick=function(){ if(i===at) pickUp(); };
  face(150,260,'translate3d(420px,'+(H/2-130)+'px,'+(z-470)+'px)','plant',PLANT);
}
for(var i=0;i<=DOME;i++) build(i);
function place(i,glide){ world.style.transform='translate3d(0,0,'+(-300+i*D)+'px)'; if(!glide) hideBehind(); }
// Rooms already left sit between the viewer and the screen, so hide them once we have arrived.
function hideBehind(){ [].forEach.call(world.children,function(e){ e.style.visibility= +e.dataset.r<at?'hidden':''; }); }
function isOpen(i){var s=st[i];return s.result==='right'||s.result==='second';}
function still(){return document.body.classList.contains('still');}
function flat(){return document.body.classList.contains('flat');}
function setStill(on){document.body.classList.toggle('still',on);$('stillBtn').setAttribute('aria-pressed',on);}
function setFlat(on){document.body.classList.toggle('flat',on);$('flatBtn').setAttribute('aria-pressed',on);}
if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches) setStill(true);
// Restore lamps, doors and curtains to match the saved state.
function restoreScene(){ kitCount(); st.forEach(function(s,i){ if(s.kit){ $('item'+i).classList.add('taken'); } if(isOpen(i)){ $('door'+i).style.transform+=' rotateY(-100deg)'; $('lamp'+i).classList.add('gold'); } else if(s.side){ $('arch'+i).classList.add('open'); $('lamp'+i).classList.add('blue'); } }); }

/* ---------- HUD ---------- */
function dots(){ $('dots').innerHTML=ROOMS.map(function(r,i){var c=isOpen(i)?'gold':st[i].side?'blue':'';return '<i class="'+c+(i===at?' here':'')+'"></i>';}).join('')+'<i class="domedot'+(at===DOME?' here':'')+'"></i>'; }
function hud(text,buttons){
  $('roomName').textContent= at===DOME?'The Beacon':ROOMS[at].name;
  $('leads').textContent= at===DOME?'· the end of the check-in':'· from '+ROOMS[at].lesson;
  $('say').innerHTML=text; dots(); var a=$('acts'); a.innerHTML='';
  buttons.forEach(function(b){var e=document.createElement('button');e.className=b[2]||'go';e.textContent=b[0];e.onclick=b[1];if(b[3])e.disabled=true;a.appendChild(e);});
}
function roomHud(){
  if(at===DOME){ hud('You\'re back at the top of the tower. Look how far the beacon reaches now.',[['See where you started and where you are now',showPlan,'go']]); return; }
  var r=ROOMS[at], s=st[at], done=isOpen(at), side=s.side;
  var text=r.arrive, resolved=done||side, k=KIT[at];
  if(done) text='The door is open, and the lamp above it is lit.'; else if(side) text='The curtain is drawn back. A lantern lights the side passage, and this idea is on your next-steps list.';
  if(resolved && !s.kit) text+=' On the desk, the '+k.name+' is waiting for you.';
  var b=[['Examine the lock',openLock,'go',done],['Take the side passage',takeSide,'soft',done||side]];
  if(resolved && !s.kit) b.push(['Pick up the '+k.name,pickUp,'go']);
  b.push([at===DOME-1?'Climb up to the beacon →':'Climb on →',walkOn,'go',!resolved]);
  b.push(['Did you know?',readNote,'soft']);
  hud(text,b);
  var el=$('item'+at); if(el) el.classList.toggle('ready',resolved && !s.kit);
}

/* ---------- Field kit and notes ---------- */
function kitCount(){ var n=st.filter(function(s){return s.kit;}).length; $('kitCount').textContent=n; return n; }
function toolCard(i){ var k=KIT[i]; return '<div class="tool"><div class="ic">'+k.icon+'</div><div><h3>'+k.title+'</h3><p class="small">Found in '+ROOMS[i].name+'</p>'+k.body()+'</div></div>'; }
function kitModal(html){ $('kitPanel').innerHTML=html+'<div class="row" style="margin-top:12px"><button class="go" id="kitClose">Back to the expedition</button></div>'; $('kitModal').classList.add('show'); $('kitClose').onclick=function(){$('kitModal').classList.remove('show');try{speechSynthesis.cancel();}catch(e){}}; setTimeout(function(){$('kitClose').focus();},0); }
function pickUp(){
  var s=st[at]; if(s.kit) return;
  if(!(isOpen(at)||s.side)){ $('say').innerHTML='Something on the desk catches your eye. It will be yours to take once you\'ve dealt with the lock — either way through.'; return; }
  s.kit=true; save(); kitCount(); var el=$('item'+at); if(el){el.classList.remove('ready');el.classList.add('taken');}
  kitModal('<h2 id="kt">You add the '+KIT[at].name+' to your field kit</h2><p class="sub">It comes with you up the Lighthouse and into the unit. Looking things up in your kit is good practice, and it is never recorded.</p>'+toolCard(at));
  roomHud();
}
function showKit(){
  var have=ROOMS.map(function(r,i){return i;}).filter(function(i){return st[i].kit;});
  kitModal('<h2 id="kt">Your field kit</h2><p class="sub">Tools you have collected. Use them whenever they help, in the Lighthouse and in the unit. Using your kit is never recorded.</p>'+
    (have.length?have.map(toolCard).join(''):'<p>Your kit is empty so far. Each floor has a tool waiting on its desk.</p>'));
}
function readNote(){
  var i=at===DOME?DOME-1:at;
  kitModal('<h2 id="kt">Did you know?</h2><p class="sub">'+ROOMS[i].name+' · just for interest: this is not part of the expedition</p><div class="didyou">'+NOTES[i]+'</div>'+('speechSynthesis' in window?'<div class="row" style="margin-top:10px"><button class="soft" id="noteRead">🔊 Read aloud</button></div>':''));
  if($('noteRead')) $('noteRead').onclick=function(){speak(NOTES[i]);};
}

/* ---------- The lock panel ---------- */
function speak(t){ try{ speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(t); u.lang='en-GB'; u.rate=.92; speechSynthesis.speak(u);}catch(e){} }
function openLock(){
  var r=ROOMS[at], s=st[at];
  var h='<h2 id="lt">'+r.name+'</h2><p class="sub">'+r.lesson+'</p><div class="q">'+r.q+'</div>';
  if('speechSynthesis' in window) h+='<div class="row"><button class="soft" id="readBtn">🔊 Read aloud</button></div>';
  h+='<div class="label">First, how does this idea feel to you now?</div><div class="row">'+[['sure','I\'ve got this'],['unsure','Getting there'],['new','Not yet sure']].map(function(f){return '<button class="opt" data-feel="'+f[0]+'" aria-pressed="'+(s.feel===f[0])+'">'+f[1]+'</button>';}).join('')+'</div>';
  h+='<div class="'+(s.feel?'':'locked')+'"><div class="label">Now try a key</div><div class="row">'+(r.choices?r.choices.map(function(c){return '<button class="opt" data-key="'+esc(c)+'">'+esc(c)+'</button>';}).join(''):'<input class="ans" id="ans" autocomplete="off" aria-label="Your answer"><button class="go" id="tryBtn">Try the key</button>')+'</div></div>';
  var have=ROOMS.map(function(x,i){return i;}).filter(function(i){return st[i].kit;});
  if(have.length) h+='<details class="glass"><summary>🎒 Open my field kit ('+have.length+')</summary>'+have.map(toolCard).join('')+'</details>';
  h+='<div class="fb" id="fb" role="status"></div><div class="row noprint" style="margin-top:14px"><button class="soft" id="sideFromLock">Take the side passage instead</button><button class="soft" id="closeLock">Step back</button></div>';
  $('lockPanel').innerHTML=h; $('lockModal').classList.add('show'); if($('ans')) NEOPalette.attach($('ans'));
  if($('readBtn')) $('readBtn').onclick=function(){speak(r.speak);};
  [].forEach.call(document.querySelectorAll('[data-feel]'),function(b){b.onclick=function(){s.feel=b.dataset.feel;save();openLock();setTimeout(function(){var a=$('ans')||document.querySelector('[data-key]');if(a)a.focus();},0);};});
  if(r.choices) [].forEach.call(document.querySelectorAll('[data-key]'),function(b){b.onclick=function(){tryKey(b.dataset.key);};});
  else { $('tryBtn').onclick=function(){tryKey($('ans').value);}; $('ans').onkeydown=function(e){if(e.key==='Enter')tryKey(this.value);}; }
  $('sideFromLock').onclick=function(){closeLock();takeSide();}; $('closeLock').onclick=closeLock;
  setTimeout(function(){var f=document.querySelector('[data-feel]');if(f)f.focus();},0);
}
function closeLock(){ try{speechSynthesis.cancel();}catch(e){} $('lockModal').classList.remove('show'); roomHud(); }
function fb(k,m){var f=$('fb');f.className='fb show '+k;f.innerHTML=m;}
function tryKey(v){
  var r=ROOMS[at], s=st[at]; if(!String(v).trim()) return;
  var res=r.choices?(v===r.answer?'right':v):r.check(v);
  if(res==='right'){
    s.result= s.result==='notyet'?'second':'right'; save();
    fb('good','<b>The key turns.</b> '+r.show);
    setTimeout(function(){closeLock();$('door'+at).style.transform+=' rotateY(-100deg)';$('lamp'+at).classList.add('gold');roomHud();},1700);
  } else {
    if(s.result===null) s.result='notyet';
    if(!s.signal && r.adult && r.adult[res]) s.signal=r.adult[res];
    save();
    var why=r.why&&r.why[res];
    fb('try',(why?why:'The key doesn\'t turn yet. '+r.hint)+' <button class="soft" id="showBtn">Show me how</button>');
    $('showBtn').onclick=function(){fb('calm',r.show+' You can try the key again, or take the side passage. Either is fine.');};
  }
}
function takeSide(){ var s=st[at]; s.side=true; save(); $('arch'+at).classList.add('open'); $('lamp'+at).classList.add('blue'); roomHud(); }
function walkOn(){
  var viaDoor=isOpen(at), next=at+1;
  hud('…',[]);
  if(flat()){ at=next; place(at); save(); arrive(); return; }
  if(!viaDoor || still()){
    $('veil').classList.add('on');
    setTimeout(function(){at=next;world.style.transition='none';place(at);world.offsetWidth;world.style.transition='';save();setTimeout(function(){$('veil').classList.remove('on');arrive();},350);},950);
  } else { at=next; place(at,true); save(); setTimeout(function(){hideBehind();arrive();},2700); }
}
function arrive(){ roomHud(); if(at===DOME) setTimeout(showPlan, flat()?0:1200); }

/* ---------- Floor plan: where you started, where you are now ---------- */
function outcome(i){ var s=st[i];
  if(s.result==='right') return s.feel==='sure'?'secure':'strength';
  if(s.result==='second') return 'getting';
  if(s.result==='notyet' && s.feel==='sure') return 'look';
  if(s.result===null && !s.side) return 'unvisited';
  return 'notyet'; }
var OUT={secure:'Secure',strength:'Secure: a hidden strength',getting:'Getting there',look:'Worth a second look',notyet:'Not yet',unvisited:'Not visited yet'};
var LEARN={secure:'You can do this on your own.',strength:'You felt unsure, but you got it. You know more than you think.',getting:'You got there with a nudge. A little more practice will make it stick.',look:'You felt sure, but it didn\'t work out this time. A short look back will help.',notyet:'This is next on your list. It\'s fine not to have it yet.',unvisited:'Waiting for you.'};
var LABELS=[
 ['Approaching Proficiency','Beginning to use the unit\'s ideas with support; several floors are next steps.'],
 ['Developing Proficiency','Uses most of the unit\'s ideas, sometimes with a nudge; a few next steps.'],
 ['Proficiency','Uses the unit\'s ideas independently and explains them.'],
 ['Refining Proficiency','Secure throughout, and extends the ideas: proof, harder cases, explaining to others.']];
var AKEY=KEY+'-adult';
function adultGet(){ try{ return JSON.parse(localStorage.getItem(AKEY)||'null'); }catch(e){ return null; } }
function adultSet(v){ try{ if(v) localStorage.setItem(AKEY,JSON.stringify(v)); else localStorage.removeItem(AKEY); }catch(e){} }
function showPlan(){
  var o=ROOMS.map(function(r,i){return outcome(i);}), done=at===DOME, start=startOutcomes(), judged=adultGet();
  var feelTxt={sure:'I\'ve got this',unsure:'Getting there',new:'Not yet sure',null:'—'};
  var h='<h2 id="pt">Where you started, and where you are now</h2><p class="sub">Algebraic Expressions and Identities · Intermediate · end-of-unit check-in</p>';
  if(judged) h+='<div class="judged"><b>Your supporting adult\'s view of the unit: '+esc(judged.label)+'</b>'+(judged.note?'<br>'+esc(judged.note):'')+'</div>';
  h+='<p>'+(done?'Gold lamps are ideas you can now use on your own. Blue lanterns are your next steps.':'Your check-in so far. You can carry on whenever you like.')+'</p>';
  if(!start.real) h+='<p class="small"><b>Prototype note:</b> the Lighthouse diagnostic was not taken on this device, so "Start" shows an example.</p>';
  h+='<div class="plan">'+ROOMS.map(function(r,i){var c=['secure','strength'].indexOf(o[i])>=0?'gold':o[i]==='unvisited'?'unvisited':'blue';
      return '<div class="roomcard '+c+'"><div class="lampdot"></div><b>'+r.name+'</b><small>'+r.lesson.replace(/^Lesson (\d) · /,'Lesson $1: ')+'</small>'+
        '<div class="journey"><span class="chip">Start: '+START_OUT[start.o[i]]+'</span>→<span class="chip now">Now: '+OUT[o[i]]+'</span></div><small>'+LEARN[o[i]]+'</small></div>';}).join('')+
    '<div class="roomcard"><div class="lampdot" style="border-radius:4px;background:#2b4470"></div><b>The Beacon</b><small>'+(done?'Reached':'At the top of the tower')+'</small></div></div>';
  var routes=ROOMS.filter(function(r,i){return ['look','notyet','getting'].indexOf(o[i])>=0;}).map(function(r){return r.route;});
  h+= routes.length?'<div class="pack"><b>Your next steps</b><p>Each one takes about ten minutes. When you\'re ready, you can come back and try those floors again.</p><ul>'+routes.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></div>'
    : (done?'<div class="pack"><b>No next steps for this unit.</b> Every idea is secure. You\'re ready for what comes next.</div>':'');
  if(done) h+='<div class="label">Looking back (optional, and only shared if you choose)</div><textarea placeholder="What are you proudest of in this unit? Is there anything you\'d like more help with?"></textarea>'+
    '<div class="row"><button class="soft" id="examBtn">Visit the Exam Corner (optional practice)</button></div>';
  h+='<details class="glass" id="adultDetails"><summary>See exactly what your supporting adult sees</summary><p class="small">The same information as your floor plan. No scores, no times, no attempt counts.</p><table class="adult"><tr><th>Floor · lesson</th><th>At the start</th><th>How it felt now</th><th>Now</th><th>What it might suggest</th><th>Next step</th></tr>'+
    ROOMS.map(function(r,i){var x=o[i];return '<tr><td>'+r.name+'<br><span class="small">'+r.lesson+'</span></td><td>'+START_OUT[start.o[i]]+'</td><td>'+feelTxt[st[i].feel]+'</td><td>'+OUT[x]+'</td><td>'+(st[i].signal?esc(st[i].signal):(x==='strength'?'Felt unsure but was right: worth saying out loud.':x==='notyet'&&st[i].side?'Chose to leave this for now.':'—'))+'</td><td>'+(['look','notyet','getting'].indexOf(x)>=0?esc(r.route):'—')+'</td></tr>';}).join('')+
    '</table><p class="small"><b>For the adult:</b> compare each floor\'s start with now. "Worth a second look" (felt sure, not yet right) usually points to a misconception worth a conversation; the maths conversation cards can help. The Exam Corner is never recorded.</p>'+
    '<div class="confirm"><b>Adult confirmation for this unit</b><p class="small">Choose the one label that best fits, using this floor plan and the Final Tasks you have seen. The learner sees what you choose.</p>'+
    LABELS.map(function(l,k){return '<label><input type="radio" name="lab" value="'+k+'"'+(judged&&judged.label===l[0]?' checked':'')+'> <b>'+l[0]+'</b><small>'+l[1]+'</small></label>';}).join('')+
    '<textarea id="adultNote" placeholder="Optional: one sentence for the learner and their family">'+(judged&&judged.note?esc(judged.note):'')+'</textarea><div class="row"><button class="go" id="confirmBtn">Confirm</button>'+(judged?'<button class="soft" id="unconfirmBtn">Clear</button>':'')+'</div><p class="small" id="confirmMsg"></p></div></details>';
  h+='<div class="row noprint"><button class="go" id="closePlan">'+(done?'Back to the beacon':'Back to the check-in')+'</button><button class="soft" id="printPlan">Print or save this page</button>'+(done?'<button class="soft" id="againBtn">Start the check-in again</button>':'')+'</div>';
  h+='<p class="small" style="margin-top:12px">Prototype v0.1 · 3 November 2026 · for discussion · saved only on this device</p>';
  $('planPanel').innerHTML=h; $('planModal').classList.add('show');
  $('closePlan').onclick=function(){$('planModal').classList.remove('show');};
  $('printPlan').onclick=function(){$('adultDetails').open=true;window.print();};
  if($('againBtn')) $('againBtn').onclick=function(){forget();adultSet(null);location.reload();};
  if($('examBtn')) $('examBtn').onclick=examCorner;
  $('confirmBtn').onclick=function(){ var r=document.querySelector('input[name="lab"]:checked'); if(!r){ $('confirmMsg').textContent='Choose a label first.'; return; }
    adultSet({label:LABELS[+r.value][0],note:$('adultNote').value.trim()}); showPlan(); $('adultDetails').open=true; };
  if($('unconfirmBtn')) $('unconfirmBtn').onclick=function(){ adultSet(null); showPlan(); $('adultDetails').open=true; };
}
function examCorner(){
  $('planModal').classList.remove('show');
  kitModal('<h2 id="kt">The Exam Corner</h2><p class="sub">Optional practice for later. These questions are written like the ones in the International GCSE exam.</p>'+
    '<div class="info"><p>There is no clock, and <b>nothing here is recorded</b>. Try one, all of them, or none. You can look at a model answer whenever you like.</p></div>'+
    EXAM.map(function(e,k){ return '<div class="exam"><p>'+(k+1)+'. '+e.q+' <span class="marks">(in the exam: '+e.marks+' marks)</span></p><div class="row"><input class="ans" id="ex'+k+'" autocomplete="off" aria-label="Your answer to question '+(k+1)+'"><button class="go" data-ex="'+k+'">Check</button><button class="soft" data-model="'+k+'">See a model answer</button></div><div class="fb" id="exfb'+k+'" role="status"></div></div>'; }).join(''));
  [].forEach.call(document.querySelectorAll('[data-ex]'),function(b){ b.onclick=function(){ var k=+b.dataset.ex, v=$('ex'+k).value, f=$('exfb'+k); if(!v.trim()) return;
    var ok=EXAM[k].check(v); f.className='fb show '+(ok?'good':'try'); f.innerHTML=ok?'<b>Yes, that\'s right.</b> In the exam, show each step to earn every mark.':'Not quite yet. Have another go, or look at the model answer.'; }; });
  EXAM.forEach(function(e,k){ NEOPalette.attach($('ex'+k)); });
  [].forEach.call(document.querySelectorAll('[data-model]'),function(b){ b.onclick=function(){ var k=+b.dataset.model, f=$('exfb'+k); f.className='fb show calm'; f.innerHTML='<b>Model answer</b><br>'+EXAM[k].model; }; });
}

/* ---------- Welcome ---------- */
function welcome(){
  var saved=load();
  var h='<h2 id="wt">Return to the Lighthouse</h2><p class="sub">Algebraic Expressions and Identities · Intermediate · end-of-unit check-in</p>'+
   '<div class="info"><p><b>This is a check-in, not a test.</b> You climbed this lighthouse at the start of the unit. Now that you\'ve worked through the lessons, you\'re back to see how far you\'ve come. There is no clock, no score and nothing to lose. It takes about 20 minutes, and you can stop and come back.</p>'+
   '<p>Each of the eight floors now asks about the big idea of its lesson. Before each lock, you\'ll say how that idea feels to you now. If a lock is one you\'re not ready for yet, the <b>side passage</b> is still there: taking it simply adds that idea to your next steps.</p>'+
   '<p>Your field kit from the start of the unit comes with you. Using it is never recorded.</p>'+
   '<p>At the top, your floor plan shows <b>where you started and where you are now</b>. Your supporting adult sees exactly the same page. Afterwards, if you\'d like to, you can visit the <b>Exam Corner</b> for some optional exam-style practice.</p></div>'+
   '<details class="glass"><summary>What is saved, and who can see it?</summary><p>Only your answers and how each idea felt to you. Nothing else: not how long you took, not how many tries, not what you clicked. The Exam Corner is never saved.</p><p>Your supporting adult sees exactly the floor plan you see, and adds one overall label for the unit, which you will see too. In this prototype, everything is kept only on this device, and nothing is sent anywhere.</p></details>'+
   '<p>If moving between floors feels uncomfortable, choose <b>Still mode</b>: floors change with a gentle fade and nothing moves. <b>Flat view</b> shows just the questions, with no 3D at all. Every question has a <b>Read aloud</b> button. You can change any of these from the top bar at any time.</p>'+
   '<div class="row">'+(saved?'<button class="go" id="contBtn">Continue where you left off</button><button class="soft" id="newBtn">Start the check-in again</button>':'<button class="go" id="enterBtn">Step inside</button><button class="soft" id="enterStillBtn">Step inside in Still mode</button><button class="soft" id="enterFlatBtn">Use Flat view</button>')+'</div>';
  $('welcomePanel').innerHTML=h;
  function go(){ kitCount(); $('welcome').classList.remove('show'); world.style.transition='none'; place(at); world.offsetWidth; world.style.transition=''; roomHud(); }
  if(saved){ $('contBtn').onclick=function(){st=saved.st;at=saved.at;restoreScene();go();}; $('newBtn').onclick=function(){forget();st=fresh();at=0;go();}; }
  else { $('enterBtn').onclick=go; $('enterStillBtn').onclick=function(){setStill(true);go();}; $('enterFlatBtn').onclick=function(){setFlat(true);go();}; }
}
place(0); welcome();
$('kitBtn').onclick=function(){ if(!$('welcome').classList.contains('show')) showKit(); };
$('planBtn').onclick=function(){ if(!$('welcome').classList.contains('show')) showPlan(); };
$('stillBtn').onclick=function(){setStill(!still());};
$('flatBtn').onclick=function(){setFlat(!flat());};
$('comfortBtn').onclick=function(){var on=document.body.classList.toggle('comfort');this.setAttribute('aria-pressed',on);};
document.addEventListener('keydown',function(e){ if(e.key==='Escape'){ if($('lockModal').classList.contains('show')) closeLock(); else { $('planModal').classList.remove('show'); $('kitModal').classList.remove('show'); } } });
</script>
