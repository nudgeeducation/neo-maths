<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Architect's Studio · Angles and Area</title>
<style>
:root{--ink:#2f3429;--paper:#f7f3ea;--h1:#3f5f45;--h2:#6a7f4e;--gold:#d8b26e;--teal:#2AB3A0;--blue:#365a68;--night:#0f1a24;
--ready:#e3f0df;--strength:#e5eef2;--refresh:#fff1cf;--new:#f1e9dc}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--night);font-family:Arial,sans-serif;color:var(--ink);overflow:hidden}
body.comfort{font-size:1.15em;letter-spacing:.02em}
body.comfort .panel,body.comfort .hud{line-height:1.75}
.top{position:fixed;inset:0 0 auto 0;height:52px;background:#1b2b3a;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 14px;gap:10px;z-index:30}
.top b{color:#7fd8cc;letter-spacing:.12em;font-size:.8em;white-space:nowrap}
.top .tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.top button{background:#2b4152;color:#fff;border:1px solid #4d6577;border-radius:8px;padding:6px 10px;font-weight:700;cursor:pointer;font-size:.82em}
.top button[aria-pressed=true]{background:var(--teal);color:#08201d;border-color:var(--teal)}

/* 3D scene */
#vp{position:fixed;top:52px;left:0;right:0;bottom:0;overflow:hidden;perspective:900px;perspective-origin:50% 40%}
#world{position:absolute;left:50%;top:46%;width:0;height:0;transform-style:preserve-3d;transition:transform 2.6s cubic-bezier(.45,.05,.35,1)}
body.still #world{transition:none}
body.flat #vp,body.flat #veil{display:none}
body.flat{background:#efe9df;overflow:auto}
body.flat .hud{position:static;transform:none;margin:76px auto 20px}
.f{position:absolute;transform-style:preserve-3d}
.wall{background:linear-gradient(180deg,#eef1ee 0 60%,#9fb3a6 60% 61.5%,#c9d6cc 61.5% 100%);box-shadow:inset 0 0 120px rgba(30,45,40,.25)}
.wall.side{background:linear-gradient(180deg,#e6ebe7 0 60%,#9fb3a6 60% 61.5%,#bfcdc2 61.5% 100%)}
.wall.side.r{background:linear-gradient(180deg,#e6ebe7 0 60%,#9fb3a6 60% 61.5%,#bfcdc2 61.5% 100%)}
.floor{background:repeating-linear-gradient(90deg,#c9a77a 0 70px,#b8956a 70px 72px),#c9a77a;box-shadow:inset 0 0 220px rgba(0,0,0,.4)}
.floor.tiles{background:repeating-linear-gradient(0deg,rgba(47,79,107,.35) 0 2px,transparent 2px 60px),repeating-linear-gradient(90deg,rgba(47,79,107,.35) 0 2px,transparent 2px 60px),#e9eef2;box-shadow:inset 0 0 220px rgba(0,0,0,.35)}
.ceiling{background:repeating-linear-gradient(90deg,#d8ddd8 0 40px,#f4f6f3 40px 240px)}
.prop{position:absolute;left:50%;top:50%;transform:translate(-50%,-55%)}
.p-board{width:540px;height:340px;background:repeating-linear-gradient(0deg,rgba(47,79,107,.18) 0 1px,transparent 1px 30px),repeating-linear-gradient(90deg,rgba(47,79,107,.18) 0 1px,transparent 1px 30px),#fbfaf5;border:16px solid #a07a4e;border-radius:6px;box-shadow:0 10px 0 rgba(0,0,0,.2);position:relative}
.p-board i{position:absolute;left:40px;bottom:30px;width:220px;height:180px;background:rgba(120,170,200,.45);border:4px solid #2f4f6b;clip-path:polygon(0 0,0 100%,100% 100%)}
.p-rose{width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,#f3ead6 0 12%,transparent 12.5%),conic-gradient(from -11.25deg,#2f4f6b 0 22.5deg,#e9dcc0 22.5deg 90deg,#2f4f6b 90deg 112.5deg,#e9dcc0 112.5deg 180deg,#2f4f6b 180deg 202.5deg,#e9dcc0 202.5deg 270deg,#2f4f6b 270deg 292.5deg,#e9dcc0 292.5deg 360deg);box-shadow:0 0 0 14px #8a6d40,0 10px 30px rgba(0,0,0,.3);position:relative}
.p-rose i{position:absolute;left:50%;top:-58px;margin-left:-14px;font-style:normal;font-family:Georgia,serif;font-size:44px;font-weight:700;color:#3a2a10}
.p-rose i:after{content:"N"}
.p-setsq{width:420px;height:320px;background:rgba(150,190,150,.55);border:6px solid #3f5f45;clip-path:polygon(0 0,0 100%,100% 100%);box-shadow:0 8px 0 rgba(0,0,0,.2)}
.p-shapes{display:flex;gap:30px;align-items:flex-end}
.p-shapes i{display:block;background:#efe6d2;border:6px solid #6b5a40}
.p-shapes i:nth-child(1){width:180px;height:180px}
.p-shapes i:nth-child(2){width:240px;height:130px;background:#e6eef5;border-color:#2f4f6b}
.p-shapes i:nth-child(3){width:150px;height:220px;background:#e8f0e2;border:0;clip-path:polygon(50% 0,100% 35%,50% 100%,0 35%)}
.p-fence{display:flex;gap:18px;align-items:flex-end;height:260px;border-bottom:16px solid #7a5536;padding:0 20px;background:linear-gradient(transparent 0 30%,#7a5536 30% 36%,transparent 36% 66%,#7a5536 66% 72%,transparent 72%)}
.p-fence i{display:block;width:48px;height:240px;background:#a07a4e;clip-path:polygon(50% 0,100% 14%,100% 100%,0 100%,0 14%)}
.p-tilesq{width:420px;height:320px;background:repeating-linear-gradient(0deg,#6b5a40 0 4px,transparent 4px 80px),repeating-linear-gradient(90deg,#6b5a40 0 4px,transparent 4px 105px),#efe6d2;border:4px solid #6b5a40;box-shadow:0 8px 0 rgba(0,0,0,.2)}
.p-gable{width:440px;height:360px;background:repeating-linear-gradient(0deg,#c9b48a 0 3px,transparent 3px 40px),#e9dcc0;clip-path:polygon(0 40%,50% 0,100% 40%,100% 100%,0 100%);box-shadow:0 8px 0 rgba(0,0,0,.2)}
.p-tape{width:560px;height:110px;background:repeating-linear-gradient(90deg,#3a2a10 0 3px,transparent 3px 56px) 0 0/100% 50px no-repeat,repeating-linear-gradient(90deg,#3a2a10 0 2px,transparent 2px 11.2px) 0 0/100% 24px no-repeat,#f2d873;border:6px solid #8f6a26;display:grid;place-items:center;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.p-tape span{margin-top:40px;font-family:Georgia,serif;font-size:40px;color:#3a2a10}
.p-window2{width:300px;height:380px;border:16px solid #a07a4e;border-radius:8px;background:repeating-linear-gradient(90deg,transparent 0 126px,#a07a4e 126px 138px),linear-gradient(#cfe3ef 0 60%,#9cb88a 60% 100%)}
.arch{position:absolute;left:50%;bottom:0;width:220px;height:380px;margin-left:-110px;border-radius:6px 6px 0 0;background:#2a2d2a;overflow:hidden;border:10px solid #a07a4e;border-bottom:0}
.arch .curtain{position:absolute;inset:0;background:repeating-linear-gradient(90deg,#9fb3a6 0 18px,#8aa093 18px 30px);transition:transform 1.4s ease}
.arch.open .curtain{transform:translateY(-100%)}
.arch .glow{position:absolute;inset:0;background:radial-gradient(circle at 50% 75%,rgba(255,240,200,.6),transparent 60%)}
.door{background:repeating-linear-gradient(0deg,#5f7d6b 0 92px,#557362 92px 96px);border:8px solid #3e5547;transform-origin:0 50%;transition:transform 1.8s ease;cursor:pointer}
body.still .door{transition:none}
.door .lock{position:absolute;right:26px;top:48%;width:46px;height:62px;border-radius:10px;background:linear-gradient(#e4c27a,#a9802f);box-shadow:0 0 0 3px #6b5020,0 0 18px rgba(255,210,120,.5)}
.door .lock:after{content:"";position:absolute;left:18px;top:20px;width:10px;height:22px;border-radius:5px;background:#3a2614}
.lintel{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.plaque{background:linear-gradient(#f4f1e6,#d9d2bc);color:#2f3a33;font-family:Georgia,serif;font-weight:700;font-size:26px;padding:8px 26px;border-radius:6px;box-shadow:0 2px 0 #8a8270;white-space:nowrap}
.lamp{width:44px;height:44px;border-radius:50%;background:#6f6a60;box-shadow:inset 0 -6px 0 rgba(0,0,0,.25);transition:all 1.2s}
.lamp.gold{background:radial-gradient(circle,#fff5c9,#f2c14e 60%,#c58a1c);box-shadow:0 0 30px 12px rgba(242,193,78,.7)}
.lamp.blue{background:radial-gradient(circle,#e8f6ff,#7fb6e0 60%,#3f7aa8);box-shadow:0 0 30px 12px rgba(127,182,224,.6)}
.bigwindow{position:absolute;left:50%;top:5%;width:860px;height:420px;margin-left:-430px;border:16px solid #a07a4e;border-radius:8px;background:repeating-linear-gradient(90deg,transparent 0 206px,#a07a4e 206px 216px),repeating-linear-gradient(0deg,transparent 0 196px,#a07a4e 196px 206px),linear-gradient(#d6e6ef 0 55%,#a9b98f 55% 100%)}
.drafttable{position:absolute;left:50%;bottom:0;width:780px;height:210px;margin-left:-390px;background:repeating-linear-gradient(0deg,rgba(47,79,107,.25) 0 1px,transparent 1px 26px),repeating-linear-gradient(90deg,rgba(47,79,107,.25) 0 1px,transparent 1px 26px),#f7f9fb;border:14px solid #a07a4e;border-bottom:0;border-radius:6px 6px 0 0}
.drafttable:after{content:"";position:absolute;left:120px;top:40px;width:300px;height:120px;border:4px solid #2f4f6b;clip-path:polygon(0 0,60% 0,60% 50%,100% 50%,100% 100%,0 100%);background:rgba(127,182,224,.25)}

/* Furniture, field-kit objects and notes */
.desk svg,.plant svg{width:100%;height:100%;display:block}
.item{cursor:pointer;transition:opacity 1s,filter .6s}
.item svg{width:100%;height:100%}
.item.ready{filter:drop-shadow(0 0 14px rgba(255,220,130,.95))}
.item.taken{opacity:0;pointer-events:none}
.rug{border-radius:16px;box-shadow:0 0 0 14px rgba(0,0,0,.08)}
.note{position:absolute;left:60px;top:250px;width:150px;height:110px;background:#f3e6c4;border:6px solid #8a6d40;border-radius:4px;font-family:Georgia,serif;font-size:21px;font-weight:700;color:#3a2a10;display:grid;place-items:center;text-align:center;cursor:pointer;transform:rotate(-3deg);box-shadow:0 4px 0 rgba(0,0,0,.25)}
.note:before{content:"";position:absolute;top:-12px;left:66px;width:14px;height:14px;border-radius:50%;background:#b0412f}

/* HUD and panels */
#veil{position:fixed;inset:52px 0 0 0;background:#000;opacity:0;pointer-events:none;transition:opacity .9s;z-index:5}
#veil.on{opacity:1}
.hud{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(780px,calc(100% - 24px));background:rgba(247,243,234,.97);border-radius:16px;padding:12px 16px 14px;z-index:10;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.where{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.where .room{font-weight:700;color:var(--h1)}
.where .leads{font-size:.88em;color:#5c6b4f}
.dots{display:flex;gap:6px;align-items:center}
.dots i{width:13px;height:13px;border-radius:50%;background:#d9d2c4;border:2px solid #b9ae98}
.dots i.gold{background:#f2c14e;border-color:#c58a1c}.dots i.blue{background:#7fb6e0;border-color:#3f7aa8}
.dots i.here{outline:3px solid var(--teal);outline-offset:1px}
.dots i.domedot{border-radius:3px}
.hud .say{margin:0 0 10px;font-size:1.05em}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button.go,button.opt,button.soft{padding:9px 14px;border-radius:10px;border:1px solid #738697;background:#fff;cursor:pointer;font-weight:600;color:var(--ink);font-size:1em}
button.go{background:var(--blue);color:#fff;border-color:var(--blue)}
button.soft{border-style:dashed;color:#5c6b4f}
button.opt[aria-pressed=true]{background:var(--h1);color:#fff;border-color:var(--h1)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.modal{position:fixed;inset:52px 0 0 0;display:none;align-items:center;justify-content:center;z-index:20;background:rgba(10,16,24,.55);padding:16px}
.modal.show{display:flex}
.panel{background:var(--paper);border-radius:18px;padding:20px 22px;width:min(680px,100%);max-height:calc(100vh - 90px);overflow:auto}
.panel h2{color:var(--h1);margin:0 0 4px}
.panel .sub{color:#5c6b4f;margin:0 0 10px;font-size:.92em}
.panel .q{font-size:1.25em;margin:6px 0 12px}.big{font-family:Georgia,'Times New Roman',serif;font-size:1.25em;white-space:nowrap}
.label{font-weight:700;color:#5c6b4f;margin:12px 0 6px}
input.ans{font-size:1.15em;padding:8px 10px;border-radius:8px;border:1px solid #738697;width:10em}
.locked{opacity:.45;pointer-events:none}
.fb{margin-top:12px;padding:12px 14px;border-radius:10px;display:none}
.fb.show{display:block}.fb.good{background:var(--ready)}.fb.try{background:var(--refresh)}.fb.calm{background:var(--strength)}
.info{background:#fffaf0;padding:12px 14px;border-left:6px solid var(--gold);border-radius:10px;margin:12px 0}
.glass{background:#e5eef2;padding:10px 14px;border-radius:10px;margin:10px 0;font-size:.95em}
.glass summary{font-weight:700;cursor:pointer}
.plan{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
.roomcard{border-radius:12px;padding:10px;background:#fff;border:3px solid #d9d2c4;text-align:center;font-size:.92em}
.roomcard .lampdot{width:20px;height:20px;border-radius:50%;margin:0 auto 6px;background:#c9c2b4}
.roomcard.gold{border-color:#f2c14e}.roomcard.gold .lampdot{background:#f2c14e;box-shadow:0 0 12px #f2c14e}
.roomcard.blue{border-color:#7fb6e0}.roomcard.blue .lampdot{background:#7fb6e0;box-shadow:0 0 12px #7fb6e0}
.roomcard.unvisited{opacity:.6}
.roomcard small{display:block;color:#5c6b4f;margin-top:4px}
.pack{background:var(--new);border-radius:12px;padding:10px 14px}
table.adult{width:100%;border-collapse:collapse;font-size:.88em;background:#fff}
table.adult th,table.adult td{border:1px solid #d9d2c4;padding:6px 8px;text-align:left;vertical-align:top}
table.adult th{background:#eef3e8}
textarea{width:100%;min-height:60px;border-radius:8px;border:1px solid #738697;padding:8px;font:inherit}
.small{font-size:.85em;color:#5c6b4f}
.tool{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:start;background:#fff;border-radius:12px;padding:12px 14px;margin:10px 0}
.tool .ic svg{width:72px;height:72px}
.tool h3{margin:0 0 4px;color:var(--h1);font-size:1.05em}
.tool p{margin:4px 0}
.tool table.sq{border-collapse:collapse;font-size:.95em}
.tool table.sq td{border:1px solid #d9d2c4;padding:3px 7px;text-align:center}
.kitlist{columns:2;margin:6px 0 0;padding-left:18px}
.didyou{background:#fffaf0;border-left:6px solid var(--gold);border-radius:10px;padding:12px 14px;font-size:1.05em}
@media (max-width:700px){.plan{grid-template-columns:repeat(2,1fr)}.top b{display:none}}
@media print{body{overflow:visible;background:#fff}.top,#vp,#veil,.hud,.noprint{display:none!important}.modal{position:static;display:block;background:none;padding:0}.modal:not(#planModal){display:none!important}.panel{max-height:none;box-shadow:none}details{display:block}details>*{display:block}}

.mathpalette{margin:8px 0 0;flex-basis:100%}
.palette-toggle{background:#365a68;color:#fff;border:none;padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:15px}
.palette-keys{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.palette-keys[hidden]{display:none}
.palette-keys button{min-width:44px;padding:8px 10px;font-size:1.1em;background:#fff;border:1px solid #bcae98;border-radius:8px;cursor:pointer;color:#2f3429}
.palette-keys button:focus-visible,.palette-toggle:focus-visible{outline:3px solid #f2c14e;outline-offset:2px}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .15em;line-height:1.2}
.fr>span{display:block;padding:0 .25em}
.fr>span:first-child{border-bottom:2px solid currentColor}
.readas{flex-basis:100%;margin-top:6px;font-size:1.05em}
.readas:empty{display:none}
.ralabel{font-size:.8em;opacity:.75;margin-right:4px}
</style>
</head>
<body>
<div class="top"><b>NEO MATHS · THE ARCHITECT'S STUDIO</b>
  <div class="tools">
    <button id="kitBtn" title="The tools you have collected">Field kit · <span id="kitCount">0</span></button>
    <button id="planBtn" title="See your floor plan at any time">Floor plan</button>
    <button id="stillBtn" aria-pressed="false" title="No movement: rooms change with a gentle fade">Still mode</button>
    <button id="flatBtn" aria-pressed="false" title="No 3D at all: just the questions, one room at a time">Flat view</button>
    <button id="comfortBtn" aria-pressed="false" title="Larger text and more space">Aa Comfort</button>
  </div></div>
<div id="vp" aria-hidden="true"><div id="world"></div></div>
<div id="veil"></div>

<div class="hud" id="hud">
  <div class="where"><div><span class="room" id="roomName"></span> <span class="leads" id="leads"></span></div><div class="dots" id="dots" aria-hidden="true"></div></div>
  <p class="say" id="say" aria-live="polite"></p>
  <div class="row" id="acts"></div>
</div>

<div class="modal show" id="welcome" role="dialog" aria-modal="true" aria-labelledby="wt"><div class="panel" id="welcomePanel"></div></div>
<div class="modal" id="lockModal" role="dialog" aria-modal="true" aria-labelledby="lt"><div class="panel" id="lockPanel"></div></div>
<div class="modal" id="kitModal" role="dialog" aria-modal="true" aria-labelledby="kt"><div class="panel" id="kitPanel"></div></div>
<div class="modal" id="planModal" role="dialog" aria-modal="true" aria-labelledby="pt"><div class="panel" id="planPanel"></div></div>

<script>window.NEO_PALETTE_SYMBOLS=["°", "²", "×", "÷"];</script>
<script id="neoPalette">
/* NEO symbols palette for expeditions (same keys and preview as the lessons). Symbols: window.NEO_PALETTE_SYMBOLS */
var NEOPalette=(function(){
  function esc(t){ return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function F(n,d){ return '<span class="fr"><span>'+n+'</span><span>'+d+'</span></span>'; }
  // How a typed answer is read: everything after "/" up to the next + or - is the denominator.
  function readAs(v){
    var s=String(v).trim(); if(!s||s.indexOf('/')<0) return '';
    s=s.replace(/\s+/g,'').replace(/[−–]/g,'-').replace(/\*/g,'').replace(/÷/g,'/').replace(/\^2/g,'²').replace(/\^3/g,'³');
    var lead=''; var m=s.match(/^([a-z]=)/i); if(m){ lead=m[1]; s=s.slice(2); }
    function strip(t){ if(t.charAt(0)==='('&&t.charAt(t.length-1)===')'){ var d=0; for(var k=0;k<t.length-1;k++){ if(t.charAt(k)==='(') d++; else if(t.charAt(k)===')') d--; if(d===0) return t; } return t.slice(1,-1); } return t; }
    function show(t){ return esc(t).replace(/([a-z])/g,'<i>$1</i>').replace(/-/g,' − ').replace(/\+/g,' + ').replace(/^ − /,'−'); }
    var terms=[], cur='', d=0;
    for(var i=0;i<s.length;i++){ var c=s.charAt(i); if(c==='(') d++; if(c===')') d--; if(d===0&&(c==='+'||c==='-')&&i>0&&'/('.indexOf(s.charAt(i-1))<0){ terms.push(cur); cur=c; } else cur+=c; }
    terms.push(cur);
    var html=terms.map(function(t){ var sign=''; if(t.charAt(0)==='+'||t.charAt(0)==='-'){ sign=t.charAt(0)==='+'?' + ':' − '; t=t.slice(1); }
      var dd=0, at=-1; for(var k=0;k<t.length;k++){ var ch=t.charAt(k); if(ch==='(') dd++; else if(ch===')') dd--; else if(ch==='/'&&dd===0){ at=k; break; } }
      return sign+(at<0?show(t):F(show(strip(t.slice(0,at))),show(strip(t.slice(at+1))))); }).join('');
    return '<span class="ralabel">Reads as:</span> '+(lead?'<i>'+lead.charAt(0)+'</i> = ':'')+html; }
  function insert(f,s){ f.focus(); var a=f.selectionStart,b=f.selectionEnd; if(a==null){a=b=f.value.length;} f.value=f.value.slice(0,a)+s+f.value.slice(b); var p=a+s.length; try{f.selectionStart=f.selectionEnd=p;}catch(e){} f.focus(); }
  function attach(f){ if(!f||f.dataset.paletteReady) return; f.dataset.paletteReady='1';
    var w=document.createElement('div'); w.className='mathpalette';
    var t=document.createElement('button'); t.type='button'; t.className='palette-toggle'; t.textContent='√ Symbols'; t.setAttribute('aria-expanded','false');
    var k=document.createElement('div'); k.className='palette-keys'; k.hidden=true;
    var pv=document.createElement('div'); pv.className='readas'; pv.setAttribute('aria-live','polite');
    function upd(){ pv.innerHTML=readAs(f.value); }
    (window.NEO_PALETTE_SYMBOLS||[]).forEach(function(s){ var b=document.createElement('button'); b.type='button'; b.textContent=s; b.setAttribute('aria-label','Insert '+s); b.onclick=function(){ insert(f,s); upd(); }; k.appendChild(b); });
    var fr=document.createElement('button'); fr.type='button'; fr.title='Insert a fraction bar (numerator / denominator)'; fr.setAttribute('aria-label','Insert a fraction bar');
    fr.innerHTML=F('a','b'); fr.onclick=function(){ insert(f,'/'); upd(); }; k.appendChild(fr);
    t.onclick=function(){ k.hidden=!k.hidden; t.setAttribute('aria-expanded',String(!k.hidden)); };
    f.addEventListener('input',upd);
    w.appendChild(t); w.appendChild(k);
    var row=f.parentNode; row.parentNode.insertBefore(pv,row.nextSibling); row.parentNode.insertBefore(w,pv);
  }

var D=1300,W=1200,H=700,L=1200,DW=280,DH=460, world=$('world'), building=0;
function face(w,h,tf,cls,html){var e=document.createElement('div');e.className='f '+cls;
  e.style.cssText='width:'+w+'px;height:'+h+'px;left:'+(-w/2)+'px;top:'+(-h/2)+'px;transform:'+tf;if(html)e.innerHTML=html;e.dataset.r=building;world.appendChild(e);return e;}
function build(i){
  building=i;
  var z=-i*D, zb=z-L/2, last=i===DOME, r=ROOMS[i]||{};
  face(W,L,'translate3d(0,'+H/2+'px,'+z+'px) rotateX(90deg)','floor '+(r.floor||''));
  face(W,L,'translate3d(0,'+(-H/2)+'px,'+z+'px) rotateX(-90deg)','ceiling');
  face(L,H,'translate3d('+(-W/2)+'px,0,'+z+'px) rotateY(90deg)','wall side', last?'<div class="prop p-window2"></div>':r.prop);
  face(L,H,'translate3d('+(W/2)+'px,0,'+z+'px) rotateY(-90deg)','wall side r', last?'<div class="prop p-window2"></div>':'<div class="arch" id="arch'+i+'"><div class="glow"></div><div class="curtain"></div></div>');
  if(last){ face(W,H,'translate3d(0,0,'+zb+'px)','wall','<div class="bigwindow"></div><div class="drafttable"></div>'); return; }
  var pw=(W-DW)/2;
  var lw=face(pw,H,'translate3d('+(-(DW/2+pw/2))+'px,0,'+zb+'px)','wall','<div class="note" role="button" tabindex="-1">Did you<br>know?</div>');
  lw.querySelector('.note').onclick=function(){ if(i===at) readNote(); };
  face(pw,H,'translate3d('+(DW/2+pw/2)+'px,0,'+zb+'px)','wall');
  face(DW+2,H-DH,'translate3d(0,'+(-DH/2)+'px,'+zb+'px)','wall');
  face(560,170,'translate3d(0,'+(-DH/2-30)+'px,'+(zb+1)+'px)','lintel','<div class="plaque">'+r.name+'</div><div class="lamp" id="lamp'+i+'"></div>');
  var d=face(DW,DH,'translate3d(0,'+((H-DH)/2)+'px,'+zb+'px)','door','<div class="lock"></div>'); d.id='door'+i;
  d.onclick=function(){ if(i===at && !isOpen(i)) openLock(); };
  // Furniture kept to the edges, so the door and the desk stay the focus.
  var rug=face(640,420,'translate3d(0,'+(H/2-2)+'px,'+(z-40)+'px) rotateX(90deg)','rug'); rug.style.background='repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 10px,transparent 10px 40px),'+RUGS[i]; rug.style.border='10px solid rgba(233,215,168,.55)';
  face(300,150,'translate3d(-380px,'+(H/2-75)+'px,'+(z-330)+'px)','desk',DESK);
  var it=face(96,96,'translate3d(-420px,'+(H/2-150-40)+'px,'+(z-328)+'px)','item',KIT[i].icon); it.id='item'+i;
  it.onclick=function(){ if(i===at) pickUp(); };
  face(150,260,'translate3d(420px,'+(H/2-130)+'px,'+(z-470)+'px)','plant',PLANT);
}
for(var i=0;i<=DOME;i++) build(i);
function place(i,glide){ world.style.transform='translate3d(0,0,'+(-300+i*D)+'px)'; if(!glide) hideBehind(); }
// Rooms already left sit between the viewer and the screen, so hide them once we have arrived.
function hideBehind(){ [].forEach.call(world.children,function(e){ e.style.visibility= +e.dataset.r<at?'hidden':''; }); }
function isOpen(i){var s=st[i];return s.result==='right'||s.result==='second';}
function still(){return document.body.classList.contains('still');}
function flat(){return document.body.classList.contains('flat');}
function setStill(on){document.body.classList.toggle('still',on);$('stillBtn').setAttribute('aria-pressed',on);}
function setFlat(on){document.body.classList.toggle('flat',on);$('flatBtn').setAttribute('aria-pressed',on);}
if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches) setStill(true);
// Restore lamps, doors and curtains to match the saved state.
function restoreScene(){ kitCount(); st.forEach(function(s,i){ if(s.kit){ $('item'+i).classList.add('taken'); } if(isOpen(i)){ $('door'+i).style.transform+=' rotateY(-100deg)'; $('lamp'+i).classList.add('gold'); } else if(s.side){ $('arch'+i).classList.add('open'); $('lamp'+i).classList.add('blue'); } }); }

/* ---------- HUD ---------- */
function dots(){ $('dots').innerHTML=ROOMS.map(function(r,i){var c=isOpen(i)?'gold':st[i].side?'blue':'';return '<i class="'+c+(i===at?' here':'')+'"></i>';}).join('')+'<i class="domedot'+(at===DOME?' here':'')+'"></i>'; }
function hud(text,buttons){
  $('roomName').textContent= at===DOME?'The Drafting Table':ROOMS[at].name;
  $('leads').textContent= at===DOME?'· the end of the expedition':'· leads into '+ROOMS[at].lesson;
  $('say').innerHTML=text; dots(); var a=$('acts'); a.innerHTML='';
  buttons.forEach(function(b){var e=document.createElement('button');e.className=b[2]||'go';e.textContent=b[0];e.onclick=b[1];if(b[3])e.disabled=true;a.appendChild(e);});
}
function roomHud(){
  if(at===DOME){ hud('You\'ve reached the big drafting table, where all the plans come together. Every room you passed through has led here.',[['See your floor plan',showPlan,'go']]); return; }
  var r=ROOMS[at], s=st[at], done=isOpen(at), side=s.side;
  var text=r.arrive, resolved=done||side, k=KIT[at];
  if(done) text='The door is open, and the lamp above it is lit.'; else if(side) text='The curtain is drawn back. A lantern lights the side passage, and this lock is on your packing list.';
  if(resolved && !s.kit) text+=' On the desk, the '+k.name+' is waiting for you.';
  if(resolved && s.kit) text+=' The '+k.name+' is in your field kit.';
  var b=[['Examine the lock',openLock,'go',done],['Take the side passage',takeSide,'soft',done||side]];
  if(resolved && !s.kit) b.push(['Pick up the '+k.name,pickUp,'go']);
  b.push([at===DOME-1?'Walk through to the drafting table →':'Walk on →',walkOn,'go',!resolved]);
  b.push(['Did you know?',readNote,'soft']);
  hud(text,b);
  var el=$('item'+at); if(el) el.classList.toggle('ready',resolved && !s.kit);
}

/* ---------- Field kit and notes ---------- */
function kitCount(){ var n=st.filter(function(s){return s.kit;}).length; $('kitCount').textContent=n; return n; }
function toolCard(i){ var k=KIT[i]; return '<div class="tool"><div class="ic">'+k.icon+'</div><div><h3>'+k.title+'</h3><p class="small">Found in '+ROOMS[i].name+'</p>'+k.body()+'</div></div>'; }
function kitModal(html){ $('kitPanel').innerHTML=html+'<div class="row" style="margin-top:12px"><button class="go" id="kitClose">Back to the expedition</button></div>'; $('kitModal').classList.add('show'); $('kitClose').onclick=function(){$('kitModal').classList.remove('show');try{speechSynthesis.cancel();}catch(e){}}; setTimeout(function(){$('kitClose').focus();},0); }
function pickUp(){
  var s=st[at]; if(s.kit) return;
  if(!(isOpen(at)||s.side)){ $('say').innerHTML='Something on the desk catches your eye. It will be yours to take once you\'ve dealt with the lock — either way through.'; return; }
  s.kit=true; save(); kitCount(); var el=$('item'+at); if(el){el.classList.remove('ready');el.classList.add('taken');}
  kitModal('<h2 id="kt">You add the '+KIT[at].name+' to your field kit</h2><p class="sub">It comes with you through the Studio and into the lessons. Looking things up in your kit is good practice, and it is never recorded.</p>'+toolCard(at));
  roomHud();
}
function showKit(){
  var have=ROOMS.map(function(r,i){return i;}).filter(function(i){return st[i].kit;});
  kitModal('<h2 id="kt">Your field kit</h2><p class="sub">Tools you have collected. Use them whenever they help, in the Studio and in the lessons. Using your kit is never recorded.</p>'+
    (have.length?have.map(toolCard).join(''):'<p>Your kit is empty so far. Each room has a tool waiting on its desk.</p>'));
}
function readNote(){
  var i=at===DOME?DOME-1:at;
  kitModal('<h2 id="kt">Did you know?</h2><p class="sub">'+ROOMS[i].name+' · just for interest: this is not part of the expedition</p><div class="didyou">'+NOTES[i]+'</div>'+('speechSynthesis' in window?'<div class="row" style="margin-top:10px"><button class="soft" id="noteRead">🔊 Read aloud</button></div>':''));
  if($('noteRead')) $('noteRead').onclick=function(){speak(NOTES[i]);};
}

/* ---------- The lock panel ---------- */
function speak(t){ try{ speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(t); u.lang='en-GB'; u.rate=.92; speechSynthesis.speak(u);}catch(e){} }
function openLock(){
  var r=ROOMS[at], s=st[at];
  var h='<h2 id="lt">'+r.name+'</h2><p class="sub">'+r.lesson+'</p><div class="q">'+r.q+'</div>';
  if('speechSynthesis' in window) h+='<div class="row"><button class="soft" id="readBtn">🔊 Read aloud</button></div>';
  h+='<div class="label">First, how does this lock look to you?</div><div class="row">'+[['sure','I\'ve got this'],['unsure','Not sure'],['new','This is new to me']].map(function(f){return '<button class="opt" data-feel="'+f[0]+'" aria-pressed="'+(s.feel===f[0])+'">'+f[1]+'</button>';}).join('')+'</div>';
  h+='<div class="'+(s.feel?'':'locked')+'"><div class="label">Now try a key</div><div class="row">'+(r.choices?r.choices.map(function(c){return '<button class="opt" data-key="'+esc(c)+'">'+esc(c)+'</button>';}).join(''):'<input class="ans" id="ans" autocomplete="off" aria-label="Your answer"><button class="go" id="tryBtn">Try the key</button>')+'</div></div>';
  var have=ROOMS.map(function(x,i){return i;}).filter(function(i){return st[i].kit;});
  if(have.length) h+='<details class="glass"><summary>🎒 Open my field kit ('+have.length+')</summary>'+have.map(toolCard).join('')+'</details>';
  h+='<div class="fb" id="fb" role="status"></div><div class="row noprint" style="margin-top:14px"><button class="soft" id="sideFromLock">Take the side passage instead</button><button class="soft" id="closeLock">Step back</button></div>';
  $('lockPanel').innerHTML=h; $('lockModal').classList.add('show'); if($('ans')) NEOPalette.attach($('ans'));
  if($('readBtn')) $('readBtn').onclick=function(){speak(r.speak);};
  [].forEach.call(document.querySelectorAll('[data-feel]'),function(b){b.onclick=function(){s.feel=b.dataset.feel;save();openLock();setTimeout(function(){var a=$('ans')||document.querySelector('[data-key]');if(a)a.focus();},0);};});
  if(r.choices) [].forEach.call(document.querySelectorAll('[data-key]'),function(b){b.onclick=function(){tryKey(b.dataset.key);};});
  else { $('tryBtn').onclick=function(){tryKey($('ans').value);}; $('ans').onkeydown=function(e){if(e.key==='Enter')tryKey(this.value);}; }
  $('sideFromLock').onclick=function(){closeLock();takeSide();}; $('closeLock').onclick=closeLock;
  setTimeout(function(){var f=document.querySelector('[data-feel]');if(f)f.focus();},0);
}
function closeLock(){ try{speechSynthesis.cancel();}catch(e){} $('lockModal').classList.remove('show'); roomHud(); }
function fb(k,m){var f=$('fb');f.className='fb show '+k;f.innerHTML=m;}
function tryKey(v){
  var r=ROOMS[at], s=st[at]; if(!String(v).trim()) return;
  var res=r.choices?(v===r.answer?'right':v):r.check(v);
  if(res==='right'){
    s.result= s.result==='notyet'?'second':'right'; save();
    fb('good','<b>The key turns.</b> '+r.show);
    setTimeout(function(){closeLock();$('door'+at).style.transform+=' rotateY(-100deg)';$('lamp'+at).classList.add('gold');roomHud();},1700);
  } else {
    if(s.result===null) s.result='notyet';
    if(!s.signal && r.adult && r.adult[res]) s.signal=r.adult[res];
    save();
    var why=r.why&&r.why[res];
    fb('try',(why?why:'The key doesn\'t turn yet. '+r.hint)+' <button class="soft" id="showBtn">Show me how</button>');
    $('showBtn').onclick=function(){fb('calm',r.show+' You can try the key again, or take the side passage. Either is fine.');};
  }
}
function takeSide(){ var s=st[at]; s.side=true; save(); $('arch'+at).classList.add('open'); $('lamp'+at).classList.add('blue'); roomHud(); }
function walkOn(){
  var viaDoor=isOpen(at), next=at+1;
  hud('…',[]);
  if(flat()){ at=next; place(at); save(); arrive(); return; }
  if(!viaDoor || still()){
    $('veil').classList.add('on');
    setTimeout(function(){at=next;world.style.transition='none';place(at);world.offsetWidth;world.style.transition='';save();setTimeout(function(){$('veil').classList.remove('on');arrive();},350);},950);
  } else { at=next; place(at,true); save(); setTimeout(function(){hideBehind();arrive();},2700); }
}
function arrive(){ roomHud(); if(at===DOME) setTimeout(showPlan, flat()?0:1200); }

/* ---------- Floor plan and the adult view ---------- */
function outcome(i){ var s=st[i];
  if(s.result==='right') return s.feel==='sure'?'ready':'strength';
  if(s.result==='second') return 'refresh';
  if(s.result==='notyet' && s.feel==='sure') return 'look';
  if(s.result===null && !s.side) return 'unvisited';
  return 'new'; }
var OUT={ready:'Ready',strength:'Hidden strength',refresh:'Got there with a nudge',look:'Worth a second look',new:'New ground',unvisited:'Not visited yet'};
var LEARN={ready:'You\'re carrying what this lesson needs.',strength:'You knew more than you thought.',refresh:'A quick refresh before this lesson would help.',look:'Worth another look before the lesson.',new:'We\'ll build this together in the lesson.',unvisited:'Waiting for you.'};
function showPlan(){
  var o=ROOMS.map(function(r,i){return outcome(i);}), done=at===DOME;
  var feelTxt={sure:'I\'ve got this',unsure:'Not sure',new:'This is new to me',null:'—'};
  var h='<h2 id="pt">Your floor plan</h2><p class="sub">Angles Tell Us Why · Perimeter and Area · Foundations · Spring term</p><p>'+(done?'Gold lamps are rooms you unlocked. Blue lanterns mark rooms we\'ll explore together in the lessons.':'Your expedition so far. You can carry on whenever you like.')+'</p><div class="plan">'+
    ROOMS.map(function(r,i){var c=isOpen(i)?'gold':st[i].side||o[i]==='new'||o[i]==='look'?'blue':o[i]==='unvisited'?'unvisited':'';
      return '<div class="roomcard '+c+'"><div class="lampdot"></div><b>'+r.name+'</b><small>'+r.lesson.replace(/^Lesson (\d) · /,'Lesson $1: ')+'</small><small><b>'+OUT[o[i]]+'</b> · '+LEARN[o[i]]+'</small></div>';}).join('')+
    '<div class="roomcard"><div class="lampdot" style="border-radius:4px;background:#2b4470"></div><b>The Drafting Table</b><small>'+(done?'Reached':'At the heart of the studio')+'</small></div></div>';
  var routes=ROOMS.filter(function(r,i){return ['look','new','refresh'].indexOf(o[i])>=0;}).map(function(r){return r.route;});
  routes=routes.filter(function(x,i){return routes.indexOf(x)===i;});
  h+= routes.length?'<div class="pack"><b>Your packing list</b><p>Short Reconnection Routes to try before the unit starts. Each one takes about ten minutes and brings you straight back.</p><ul>'+routes.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></div>'
    : (done?'<div class="pack"><b>Your packing list is empty.</b> You\'re carrying everything this unit builds on. Enjoy the journey.</div>':'');
  var have=ROOMS.map(function(r,i){return i;}).filter(function(i){return st[i].kit;}), missed=ROOMS.map(function(r,i){return i;}).filter(function(i){return !st[i].kit;});
  h+='<div class="label">Your field kit for this unit</div>'+(have.length?'<ul class="kitlist">'+have.map(function(i){return '<li>'+KIT[i].title+'</li>';}).join('')+'</ul>':'<p class="small">Empty so far.</p>')+
     (missed.length&&done?'<p class="small">Still waiting on a desk: '+missed.map(function(i){return KIT[i].title+' ('+ROOMS[i].name+')';}).join(', ')+'. Your supporting adult can give you these at the start of the unit.</p>':'');
  if(done) h+='<div class="label">How do you feel about starting this unit? (Optional — only kept if you choose to share it.)</div><textarea placeholder="Anything you\'d like your supporting adult to know…"></textarea>';
  h+='<details class="glass" id="adultDetails"><summary>See exactly what your supporting adult sees</summary><p class="small">The same information as your floor plan. No scores, no times, no attempt counts.</p><table class="adult"><tr><th>Room · lesson</th><th>How the lock looked</th><th>Outcome</th><th>What it might suggest</th><th>Suggested route</th></tr>'+
    ROOMS.map(function(r,i){var x=o[i];return '<tr><td>'+r.name+'<br><span class="small">'+r.lesson+'</span></td><td>'+feelTxt[st[i].feel]+'</td><td>'+OUT[x]+'</td><td>'+(st[i].signal?esc(st[i].signal):(x==='strength'?'Felt unsure but was right: worth saying out loud.':x==='new'&&st[i].side?'Chose to learn this in the unit.':'—'))+'</td><td>'+(['look','new','refresh'].indexOf(x)>=0?esc(r.route):'—')+'</td></tr>';}).join('')+
    '</table><p class="small"><b>For the adult:</b> "Worth a second look" (felt sure, not yet right) is the most useful signal; it often points to a misconception worth a conversation. "Hidden strength" is worth saying out loud. Outcomes use the learner\'s own words and never a score.</p></details>';
  h+='<div class="row noprint"><button class="go" id="closePlan">'+(done?'Back to the drafting table':'Back to the expedition')+'</button><button class="soft" id="printPlan">Print or save this floor plan</button>'+(done?'<button class="soft" id="againBtn">Start a new expedition</button>':'')+'</div>';
  h+='<p class="small" style="margin-top:12px">Prototype v0.1 · 12 November 2026 · for discussion · saved only on this device</p>';
  $('planPanel').innerHTML=h; $('planModal').classList.add('show');
  $('closePlan').onclick=function(){$('planModal').classList.remove('show');};
  $('printPlan').onclick=function(){$('adultDetails').open=true;window.print();};
  if($('againBtn')) $('againBtn').onclick=function(){forget();location.reload();};
}

/* ---------- Welcome ---------- */
function welcome(){
  var saved=load();
  var h='<h2 id="wt">Welcome to the Architect\'s Studio</h2><p class="sub">Angles Tell Us Why · Perimeter and Area · Foundations · before you set off</p>'+
   '<div class="info"><p><b>This is an expedition, not a test.</b> There is no clock, no score and nothing to lose. It takes about 20 minutes, and you can stop and come back.</p>'+
   '<p>The Architect\'s Studio is a calm room of drawing boards and plans. It has eight rooms, one for each lesson in the two units: four about angles, then four about perimeter and area as you plan a small garden building. You walk from the drawing board to the big drafting table at its heart. Each room has a locked door, and the right answer is the key. If a lock looks unfamiliar, every room also has a <b>side passage</b> that leads on just the same. Taking it is a good choice: it tells us what to help you with.</p><p>In every room you will also find a <b>tool for your field kit</b> on the desk. It comes with you into the lessons, and looking things up in it is never recorded.</p></div>'+
   '<details class="glass"><summary>What is saved, and who can see it?</summary><p>Only your answers and how each lock looked to you. Nothing else: not how long you took, not how many tries, not what you clicked.</p><p>Your supporting adult sees exactly the floor plan you see. In this prototype, your progress is kept only on this device so you can come back to it, and nothing is sent anywhere.</p></details>'+
   '<p>If moving between rooms feels uncomfortable, choose <b>Still mode</b>: rooms change with a gentle fade and nothing moves. <b>Flat view</b> shows just the questions, with no 3D at all. Every question has a <b>Read aloud</b> button. You can change any of these from the top bar at any time.</p>'+
   '<div class="row">'+(saved?'<button class="go" id="contBtn">Continue where you left off</button><button class="soft" id="newBtn">Start a new expedition</button>':'<button class="go" id="enterBtn">Step inside</button><button class="soft" id="enterStillBtn">Step inside in Still mode</button><button class="soft" id="enterFlatBtn">Use Flat view</button>')+'</div>';
  $('welcomePanel').innerHTML=h;
  function go(){ $('welcome').classList.remove('show'); world.style.transition='none'; place(at); world.offsetWidth; world.style.transition=''; roomHud(); }
  if(saved){ $('contBtn').onclick=function(){st=saved.st;at=saved.at;restoreScene();go();}; $('newBtn').onclick=function(){forget();st=fresh();at=0;go();}; }
  else { $('enterBtn').onclick=go; $('enterStillBtn').onclick=function(){setStill(true);go();}; $('enterFlatBtn').onclick=function(){setFlat(true);go();}; }
}
place(0); welcome();
$('kitBtn').onclick=function(){ if(!$('welcome').classList.contains('show')) showKit(); };
$('planBtn').onclick=function(){ if(!$('welcome').classList.contains('show')) showPlan(); };
$('stillBtn').onclick=function(){setStill(!still());};
$('flatBtn').onclick=function(){setFlat(!flat());};
$('comfortBtn').onclick=function(){var on=document.body.classList.toggle('comfort');this.setAttribute('aria-pressed',on);};
document.addEventListener('keydown',function(e){ if(e.key==='Escape'){ if($('lockModal').classList.contains('show')) closeLock(); else { $('planModal').classList.remove('show'); $('kitModal').classList.remove('show'); } } });
</script>
</body>
</html>
